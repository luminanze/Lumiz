<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumiz — Official Streaming Network by Lumiztudio</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            lumiz: '#8A2BE2'
          }
        }
      }
    };
  </script>

  <!-- React, ReactDOM, Babel, & Supabase CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .card-vertical { aspect-ratio: 9 / 16; }
    .card-horizontal { aspect-ratio: 16 / 9; }
  </style>
</head>
<body class="bg-[#0A0A0A] text-white selection:bg-[#8A2BE2]/40">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. KONFIGURASI SUPABASE & EMAIL ADMIN RESMI
    // ==========================================
    const SUPABASE_URL = 'https://wjxgwnekpskwgsscjptt.supabase.co';
    const SUPABASE_PUBLIC_KEY = 'sb_publishable_783OBGYwk2zKrIDskGAKfg_lAscLdhU';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);

    const ADMIN_EMAILS = [
      'keano.dranantya@gmail.com',
      'luminanze.team@gmail.com'
    ];

    const DEFAULT_GENRES = ['Origin', 'Animation', 'Sci-Fi', 'Action'];

    // ==========================================
    // 2. IKON SVG BAWAAN
    // ==========================================
    const IconPlay = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    );
    const IconPlus = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    );
    const IconX = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const IconEdit = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    );
    const IconTrash = () => (
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    );
    const IconSettings = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    );
    const IconLeft = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    );
    const IconRight = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    );

    // ==========================================
    // 3. HELPER DETEKSI LINK GOOGLE DRIVE & YOUTUBE
    // ==========================================
    const getDriveFileId = (url) => {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    };

    const getYouTubeId = (url) => {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    };

    // Embed URL untuk Pemutar Utama di Modal (Bisa Drive, Bisa YouTube)
    const getPlayerEmbedUrl = (url) => {
      if (!url) return null;
      const ytId = getYouTubeId(url);
      if (ytId) {
        return `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
      }
      const driveId = getDriveFileId(url);
      if (driveId) {
        return `https://drive.google.com/file/d/${driveId}/preview`;
      }
      return null;
    };

    // Embed URL khusus untuk Hover Preview (YouTube Autoplay Muted Loop)
    const getHoverYouTubeEmbedUrl = (url) => {
      const ytId = getYouTubeId(url);
      if (!ytId) return null;
      return `https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&loop=1&playlist=${ytId}&playsinline=1&rel=0&showinfo=0`;
    };

    // Konversi Poster (Mendukung Drive, Thumbnail YouTube otomatis, atau Link Gambar biasa)
    const getPosterUrl = (url, fallbackYtUrl = '') => {
      if (url) {
        const driveId = getDriveFileId(url);
        if (driveId) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1200`;
        const ytId = getYouTubeId(url);
        if (ytId) return `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
        return url;
      }
      const fallbackYtId = getYouTubeId(fallbackYtUrl);
      if (fallbackYtId) return `https://img.youtube.com/vi/${fallbackYtId}/hqdefault.jpg`;
      return '';
    };

    // ==========================================
    // 4. MODAL KELOLA GENRE (TAMBAH / EDIT / HAPUS GENRE)
    // ==========================================
    const GenreManagerModal = ({ isOpen, onClose, genres, setGenres, onCatalogUpdated }) => {
      const [newGenre, setNewGenre] = useState('');
      const [editingIdx, setEditingIdx] = useState(null);
      const [editingValue, setEditingValue] = useState('');
      const [busy, setBusy] = useState(false);

      if (!isOpen) return null;

      const saveGenresToLocal = (updatedList) => {
        setGenres(updatedList);
        localStorage.setItem('lumiz_custom_genres', JSON.stringify(updatedList));
      };

      const handleAddGenre = (e) => {
        e.preventDefault();
        const trimmed = newGenre.trim();
        if (!trimmed) return;
        if (genres.some(g => g.toLowerCase() === trimmed.toLowerCase())) {
          alert('Genre tersebut sudah ada!');
          return;
        }
        saveGenresToLocal([...genres, trimmed]);
        setNewGenre('');
      };

      const handleSaveEdit = async (oldName) => {
        const trimmed = editingValue.trim();
        if (!trimmed || trimmed === oldName) {
          setEditingIdx(null);
          return;
        }
        setBusy(true);
        // Update semua video di Supabase yang memakai nama genre lama
        await supabase.from('lumiz_catalog').update({ category: trimmed }).eq('category', oldName);
        const updated = genres.map(g => (g === oldName ? trimmed : g));
        saveGenresToLocal(updated);
        setEditingIdx(null);
        setBusy(false);
        onCatalogUpdated();
      };

      const handleDeleteGenre = (genreName) => {
        if (!window.confirm(`Hapus genre "${genreName}" dari daftar filter?`)) return;
        const updated = genres.filter(g => g !== genreName);
        saveGenresToLocal(updated);
      };

      return (
        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#141414] border border-[#8A2BE2]/40 rounded-2xl max-w-md w-full p-6 text-white shadow-2xl">
            <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
              <h3 className="text-lg font-bold flex items-center gap-2">
                <IconSettings /> Kelola Genre Lumiz
              </h3>
              <button onClick={onClose} className="p-1.5 hover:bg-white/10 rounded-full"><IconX /></button>
            </div>

            <form onSubmit={handleAddGenre} className="flex gap-2 mb-5">
              <input
                type="text"
                value={newGenre}
                onChange={e => setNewGenre(e.target.value)}
                placeholder="Nama genre baru (cth: Medieval, Comedy)..."
                className="flex-1 bg-[#0A0A0A] border border-white/15 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#8A2BE2]"
              />
              <button type="submit" className="px-4 py-2 bg-[#8A2BE2] hover:bg-violet-700 rounded-lg text-xs font-bold whitespace-nowrap">
                + Tambah
              </button>
            </form>

            <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
              {genres.length === 0 ? (
                <p className="text-xs text-gray-500 text-center py-4">Belum ada genre. Tambahkan di atas.</p>
              ) : (
                genres.map((g, idx) => (
                  <div key={g} className="flex items-center justify-between bg-[#0A0A0A] px-3 py-2.5 rounded-lg border border-white/10">
                    {editingIdx === idx ? (
                      <div className="flex items-center gap-2 flex-1 mr-2">
                        <input
                          type="text"
                          value={editingValue}
                          onChange={e => setEditingValue(e.target.value)}
                          className="flex-1 bg-[#141414] border border-[#8A2BE2] rounded px-2 py-1 text-xs text-white"
                          autoFocus
                        />
                        <button
                          disabled={busy}
                          onClick={() => handleSaveEdit(g)}
                          className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-[11px] font-bold"
                        >
                          Simpan
                        </button>
                      </div>
                    ) : (
                      <span className="text-xs font-semibold text-gray-200">{g}</span>
                    )}

                    {editingIdx !== idx && (
                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => { setEditingIdx(idx); setEditingValue(g); }}
                          className="p-1.5 rounded bg-white/5 hover:bg-[#8A2BE2] text-gray-300 hover:text-white transition"
                          title="Ubah Nama Genre"
                        >
                          <IconEdit />
                        </button>
                        <button
                          onClick={() => handleDeleteGenre(g)}
                          className="p-1.5 rounded bg-white/5 hover:bg-red-600 text-gray-300 hover:text-white transition"
                          title="Hapus Genre"
                        >
                          <IconTrash />
                        </button>
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>

            <div className="mt-5 pt-3 border-t border-white/10 flex justify-end">
              <button onClick={onClose} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold">
                Selesai
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. MODAL DETAIL (PEMUTAR VIDEO DRIVE & YOUTUBE)
    // ==========================================
    const DetailModal = ({ item, onClose }) => {
      const [activeVideoUrl, setActiveVideoUrl] = useState(null);

      useEffect(() => {
        setActiveVideoUrl(null);
      }, [item]);

      if (!item) return null;

      const chapters = item.chapters && item.chapters.length > 0 ? item.chapters : [
        { id: 1, title: 'Episode 1', duration: 'Play', drive_url: item.video_url }
      ];

      const currentUrl = activeVideoUrl || chapters[0]?.drive_url || item.video_url;
      const embedUrl = getPlayerEmbedUrl(currentUrl);

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-10">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onClose}></div>
          
          <div className="relative w-full max-w-4xl max-h-[92vh] bg-[#121212] border border-white/15 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            
            <button onClick={onClose} className="absolute top-4 right-4 z-30 p-2 bg-black/70 hover:bg-[#8A2BE2] text-white rounded-full backdrop-blur-md transition-all">
              <IconX />
            </button>

            <div className="relative w-full aspect-video bg-black shrink-0">
              {activeVideoUrl ? (
                embedUrl ? (
                  <iframe
                    src={embedUrl}
                    className="w-full h-full border-0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                    allowFullScreen
                    title={item.title}
                  />
                ) : (
                  <video src={currentUrl} controls autoPlay className="w-full h-full object-contain" />
                )
              ) : (
                <>
                  <img src={getPosterUrl(item.img, item.video_url)} alt={item.title} className="w-full h-full object-cover opacity-80" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#121212] via-black/40 to-transparent"></div>
                  <div className="absolute bottom-6 left-6 md:left-10 z-10 right-6">
                    <span className="inline-block text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-[#8A2BE2] text-white mb-2">
                      {item.category || 'Original'} • {item.type === 'short' ? '9:16 Short' : '16:9 Series'}
                    </span>
                    <h2 className="text-2xl md:text-4xl font-bold text-white drop-shadow-lg mb-4">
                      {item.title}
                    </h2>
                    <button 
                      onClick={() => setActiveVideoUrl(chapters[0]?.drive_url || item.video_url)}
                      className="flex items-center gap-2 bg-[#8A2BE2] hover:bg-violet-700 text-white px-6 py-2.5 rounded-lg font-bold transition-colors shadow-lg"
                    >
                      <IconPlay /> Putar Video Utama
                    </button>
                  </div>
                </>
              )}
            </div>

            <div className="p-6 md:p-8 overflow-y-auto scrollbar-hide">
              <p className="text-gray-300 mb-6 leading-relaxed text-sm md:text-base">
                {item.description}
              </p>

              <h3 className="text-lg font-bold mb-3 text-white flex items-center justify-between border-b border-white/10 pb-2">
                <span>Daftar Chapter / Episode (Full Video)</span>
                <span className="text-xs font-normal text-gray-400">{chapters.length} Bagian</span>
              </h3>
              
              <div className="flex flex-col gap-2">
                {chapters.map((chap, idx) => {
                  const isPlayingThis = activeVideoUrl === (chap.drive_url || item.video_url);
                  return (
                    <div 
                      key={idx} 
                      onClick={() => setActiveVideoUrl(chap.drive_url || item.video_url)}
                      className={`flex items-center justify-between p-3.5 rounded-xl border transition-all cursor-pointer group ${
                        isPlayingThis
                          ? 'border-[#8A2BE2] bg-[#8A2BE2]/20'
                          : 'border-transparent hover:border-[#8A2BE2]/50 bg-[#1a1a1a] hover:bg-violet-500/10'
                      }`}
                    >
                      <div className="flex items-center gap-4">
                        <span className="text-xl font-black text-gray-500 group-hover:text-[#8A2BE2] w-6 text-center">
                          {idx + 1}
                        </span>
                        <h4 className="font-semibold text-sm md:text-base text-white group-hover:text-[#8A2BE2] transition-colors">
                          {chap.title}
                        </h4>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-medium text-gray-400">{chap.duration || 'Play'}</span>
                        <div className="p-2 rounded-full bg-[#8A2BE2]/20 text-[#8A2BE2] group-hover:bg-[#8A2BE2] group-hover:text-white transition-all">
                          <IconPlay />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 6. MODAL FORM TAMBAH & EDIT VIDEO (ADMIN)
    // ==========================================
    const AdminFormModal = ({ isOpen, onClose, initialData, onSaved, genres, onAddCustomGenre }) => {
      const [formData, setFormData] = useState({
        type: 'short', category: genres[0] || 'Origin', title: '', description: '', img: '', video_url: '',
        chapters: [{ id: 1, title: 'Episode 1', duration: '02m', drive_url: '' }]
      });
      const [customCategory, setCustomCategory] = useState('');
      const [useCustomCat, setUseCustomCat] = useState(false);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (initialData) {
          setFormData({
            ...initialData,
            chapters: initialData.chapters?.length ? initialData.chapters : [{ id: 1, title: 'Episode 1', duration: '02m', drive_url: '' }]
          });
          setUseCustomCat(false);
        } else {
          setFormData({
            type: 'short', category: genres[0] || 'Origin', title: '', description: '', img: '', video_url: '',
            chapters: [{ id: 1, title: 'Episode 1', duration: '02m', drive_url: '' }]
          });
          setUseCustomCat(false);
        }
      }, [initialData, isOpen, genres]);

      if (!isOpen) return null;

      const handleAddChapter = () => {
        setFormData({
          ...formData,
          chapters: [...formData.chapters, { id: formData.chapters.length + 1, title: `Episode ${formData.chapters.length + 1}`, duration: '05m', drive_url: '' }]
        });
      };

      const handleChapterChange = (index, field, value) => {
        const updated = [...formData.chapters];
        updated[index][field] = value;
        setFormData({ ...formData, chapters: updated });
      };

      const handleRemoveChapter = (index) => {
        setFormData({ ...formData, chapters: formData.chapters.filter((_, i) => i !== index) });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);

        const finalCategory = useCustomCat && customCategory.trim() ? customCategory.trim() : formData.category;
        if (useCustomCat && customCategory.trim()) {
          onAddCustomGenre(customCategory.trim());
        }

        const payload = {
          type: formData.type,
          category: finalCategory,
          title: formData.title,
          description: formData.description,
          img: formData.img,
          video_url: formData.video_url,
          chapters: formData.chapters
        };

        let error;
        if (initialData && initialData.id) {
          ({ error } = await supabase.from('lumiz_catalog').update(payload).eq('id', initialData.id));
        } else {
          ({ error } = await supabase.from('lumiz_catalog').insert([payload]));
        }

        setSaving(false);
        if (error) {
          alert('Gagal menyimpan ke Supabase: ' + error.message);
        } else {
          onSaved();
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#141414] border border-[#8A2BE2]/40 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto text-white shadow-2xl">
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-3">
              <h3 className="text-xl font-bold">
                {initialData ? '✏️ Edit Tayangan Lumiz' : '+ Upload Tayangan Baru'}
              </h3>
              <button onClick={onClose} className="p-1.5 hover:bg-white/10 rounded-full"><IconX /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-sm">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-gray-400 mb-1 font-semibold">Format Tayangan</label>
                  <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white">
                    <option value="short">Shorts (Vertikal 9:16)</option>
                    <option value="series">Series (Landscape 16:9)</option>
                  </select>
                </div>
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-gray-400 font-semibold">Genre / Kategori</label>
                    <button
                      type="button"
                      onClick={() => setUseCustomCat(!useCustomCat)}
                      className="text-[11px] text-[#8A2BE2] hover:underline font-semibold"
                    >
                      {useCustomCat ? 'Pilih dari Daftar' : '+ Ketik Genre Baru'}
                    </button>
                  </div>
                  {useCustomCat ? (
                    <input
                      required
                      type="text"
                      value={customCategory}
                      onChange={e => setCustomCategory(e.target.value)}
                      placeholder="Ketik nama genre baru..."
                      className="w-full bg-[#0A0A0A] border border-[#8A2BE2] rounded-lg p-2.5 text-white"
                    />
                  ) : (
                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white">
                      {genres.map(g => (
                        <option key={g} value={g}>{g}</option>
                      ))}
                    </select>
                  )}
                </div>
              </div>

              <div>
                <label className="block text-gray-400 mb-1 font-semibold">Judul Tayangan</label>
                <input required type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="Masukkan judul..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white" />
              </div>

              <div>
                <label className="block text-gray-400 mb-1 font-semibold">Sinopsis Cerita</label>
                <textarea required rows="2" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} placeholder="Tulis sinopsis cerita di sini..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white"></textarea>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#0A0A0A]/60 p-3.5 rounded-xl border border-white/10">

    // ==========================================

                  <IconSettings /> Genre
                </button>
                <button onClick={onAddClick} className="flex items-center gap-1 text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-lg transition shadow-lg">

    const MainApp = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [catalog, setCatalog] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedItem, setSelectedItem] = useState(null);
      
      const [user, setUser] = useState(null);
      const [adminModalOpen, setAdminModalOpen] = useState(false);
      const [genreModalOpen, setGenreModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      // Inisialisasi daftar Genre dari LocalStorage atau Default
      const [genres, setGenres] = useState(() => {
        try {
          const saved = localStorage.getItem('lumiz_custom_genres');
          return saved ? JSON.parse(saved) : DEFAULT_GENRES;
        } catch {
          return DEFAULT_GENRES;
        }
      });

      const isAdmin = user && ADMIN_EMAILS.includes(user.email?.toLowerCase());

      const fetchCatalog = async () => {
        setLoading(true);
        const { data, error } = await supabase
          .from('lumiz_catalog')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data) {
          setCatalog(data);
          // Gabungkan genre yang ada di database agar tidak ada kategori video yang tertinggal
          const dbCategories = [...new Set(data.map(i => i.category).filter(Boolean))];
          setGenres(prev => {
            const merged = [...prev];
            dbCategories.forEach(c => {
              if (!merged.some(g => g.toLowerCase() === c.toLowerCase())) {
                merged.push(c);
              }
            });
            localStorage.setItem('lumiz_custom_genres', JSON.stringify(merged));
            return merged;
          });
        }
        setLoading(false);
      };

      const handleAddCustomGenre = (newCat) => {
        setGenres(prev => {
          if (prev.some(g => g.toLowerCase() === newCat.toLowerCase())) return prev;
          const updated = [...prev, newCat];
          localStorage.setItem('lumiz_custom_genres', JSON.stringify(updated));
          return updated;
        });
      };

      useEffect(() => {
        fetchCatalog();

        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        const redirectUrl = window.location.origin + window.location.pathname;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: redirectUrl }
        });
        if (error) alert('Gagal membuka login Google: ' + error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
      };

      const handleDeleteVideo = async (id) => {
        if (!window.confirm('Yakin ingin menghapus tayangan ini secara permanen dari database Lumiz?')) return;
        const { error } = await supabase.from('lumiz_catalog').delete().eq('id', id);
        if (!error) {
          setCatalog(prev => prev.filter(i => i.id !== id));
        } else {
          alert('Gagal menghapus: ' + error.message);
        }
      };

      const featuredHero = catalog.length > 0 ? catalog[0] : null;

      return (
        <div className="min-h-screen bg-[#0A0A0A] text-white font-sans">
          
          <Header 
            activeTab={activeTab} 
            setActiveTab={setActiveTab} 
            isAdmin={isAdmin} 
            onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
            onOpenGenreModal={() => setGenreModalOpen(true)}
          />

          <main className="pb-24 md:pb-12">
            {activeTab === 'home' && (
              <div>
                <div className="relative w-full h-[50vh] md:h-[68vh] overflow-hidden bg-gradient-to-br from-[#141414] via-[#0A0A0A] to-[#1a0933] border-b border-white/5">
                  {featuredHero ? (
                    <>
                      <img src={getPosterUrl(featuredHero.img, featuredHero.video_url)} alt={featuredHero.title} className="absolute inset-0 w-full h-full object-cover opacity-45" />
                      <div className="absolute inset-0 bg-gradient-to-t from-[#0A0A0A] via-[#0A0A0A]/40 to-transparent" />
                      <div className="absolute bottom-[12%] left-6 md:left-12 max-w-2xl z-10 pr-6">
                        <span className="text-xs font-bold uppercase tracking-widest px-3 py-1 rounded bg-[#8A2BE2] text-white mb-3 inline-block">
                          Rilisan Terbaru • {featuredHero.category}
                        </span>
                        <h1 className="text-3xl md:text-6xl font-black text-white mb-3 drop-shadow-lg">
                          {featuredHero.title}
                        </h1>
                        <p className="text-xs md:text-base text-gray-300 max-w-xl line-clamp-3 mb-5">
                          {featuredHero.description}
                        </p>
                        <button 
                          onClick={() => setSelectedItem(featuredHero)}
                          className="flex items-center gap-2 bg-white text-black hover:bg-[#8A2BE2] hover:text-white px-6 py-2.5 rounded-lg font-bold text-sm transition shadow-xl"
                        >
                          <IconPlay /> Tonton Sekarang
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
                      <span className="text-[11px] font-bold uppercase tracking-[0.25em] px-3 py-1 rounded-full bg-white/5 border border-white/10 text-gray-300 mb-4">
                        Lumi<span className="text-[#8A2BE2]">z</span>tudio Official Network
                      </span>
                      <h1 className="text-4xl md:text-6xl font-black tracking-tight text-white mb-3">
                        LUMI<span className="text-[#8A2BE2]">Z</span>
                      </h1>
                      <p className="text-xs md:text-sm text-gray-400 max-w-md">
                        Platform streaming dan katalog original produksi Lumiztudio di bawah supervisi artistik Nezen.
                      </p>
                    </div>
                  )}
                </div>

                <StudioGallery 
                  items={catalog} 
                  loading={loading}
                  viewMode="home" 
                  onItemClick={setSelectedItem}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteVideo}
                  genres={genres}
                  onOpenGenreModal={() => setGenreModalOpen(true)}
                />
              </div>
            )}

            {activeTab === 'shorts' && (
              <div className="pt-20">
                <StudioGallery 
                  items={catalog} 
                  loading={loading}
                  viewMode="shorts" 
                  onItemClick={setSelectedItem}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteVideo}
                  genres={genres}
                  onOpenGenreModal={() => setGenreModalOpen(true)}
                />
              </div>
            )}

            {activeTab === 'series' && (
              <div className="pt-20">
                <StudioGallery 
                  items={catalog} 
                  loading={loading}
                  viewMode="series" 
                  onItemClick={setSelectedItem}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteVideo}
                  genres={genres}
                  onOpenGenreModal={() => setGenreModalOpen(true)}
                />
              </div>
            )}

            {activeTab === 'account' && (
              <div className="pt-28 px-6 flex flex-col items-center justify-center min-h-[75vh] text-center">
                {user ? (
                  <div className="max-w-md w-full bg-[#141414] p-6 rounded-2xl border border-white/10 shadow-xl">
                    <h2 className="text-xl font-bold mb-1">{user.user_metadata?.full_name || 'Lumiz User'}</h2>
                    <p className="text-sm text-gray-400 mb-4">{user.email}</p>

                    {isAdmin ? (
                      <div className="mb-6 p-3 rounded-xl bg-[#8A2BE2]/20 border border-[#8A2BE2] text-xs text-violet-300 font-semibold">
                        ✓ Status: Admin Resmi Lumiztudio. Fitur Upload Video & Kelola Genre aktif.
                      </div>
                    ) : (
                      <div className="mb-6 p-3 rounded-xl bg-white/5 text-xs text-gray-400">
                        Status: Penonton Reguler
                      </div>
                    )}

                    <div className="flex flex-col gap-3">
                      {isAdmin && (
                        <>
                          <button 
                            onClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                            className="w-full py-2.5 rounded-xl bg-[#8A2BE2] hover:bg-violet-700 text-white font-bold transition"
                          >
                            + Upload Video Baru
                          </button>
                          <button 
                            onClick={() => setGenreModalOpen(true)}
                            className="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-semibold transition"
                          >
                            ⚙️ Kelola Daftar Genre
                          </button>
                        </>
                      )}
                      <button onClick={handleLogout} className="w-full py-2.5 rounded-xl border border-red-500/40 text-red-400 hover:bg-red-500/10 font-semibold transition">
                        Keluar (Sign Out)
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="max-w-md w-full bg-[#141414] p-8 rounded-2xl border border-white/10 shadow-xl">
                    <h2 className="text-2xl font-bold mb-2">Masuk ke Lumi<span className="text-[#8A2BE2]">z</span></h2>
                    <p className="text-xs text-gray-400 mb-6">
                      Silakan masuk dengan akun Google Anda. Akses manajemen katalog otomatis terbuka untuk email Admin resmi.
                    </p>
                    <button 
                      onClick={handleGoogleLogin}
                      className="w-full py-3 px-6 rounded-xl bg-white text-black font-bold hover:bg-gray-200 transition flex items-center justify-center gap-3 shadow-lg"
                    >
                      Masuk dengan Google
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="border-t border-white/10 py-8 px-6 text-center text-xs text-gray-500">
            © 2026 Lumi<span className="text-[#8A2BE2] font-bold">z</span> Streaming Network. Produced by Lumi<span className="text-[#8A2BE2] font-bold">z</span>tudio | Supervised by Nezen | Part of Luminan<span className="text-[#8A2BE2] font-bold">z</span>e & ZK Group.
          </footer>

          <div className="md:hidden fixed bottom-0 w-full bg-[#121212]/95 backdrop-blur-lg border-t border-white/10 z-50">
            <div className="flex justify-around items-center h-14 text-xs font-bold">
              <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Home</button>
              <button onClick={() => setActiveTab('shorts')} className={activeTab === 'shorts' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Shorts</button>
              <button onClick={() => setActiveTab('series')} className={activeTab === 'series' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Series</button>
              <button onClick={() => setActiveTab('account')} className={activeTab === 'account' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Account</button>
            </div>
          </div>

          <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />

          <AdminFormModal 
            isOpen={adminModalOpen} 
            onClose={() => setAdminModalOpen(false)} 
            initialData={editingItem}
            onSaved={fetchCatalog}
            genres={genres}
            onAddCustomGenre={handleAddCustomGenre}
          />

          <GenreManagerModal
            isOpen={genreModalOpen}
            onClose={() => setGenreModalOpen(false)}
            genres={genres}
            setGenres={setGenres}
            onCatalogUpdated={fetchCatalog}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
