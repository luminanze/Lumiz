<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumiz — Studio Gallery</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

    @keyframes zoomInModal {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-zoom-in-modal { animation: zoomInModal 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#050505] text-gray-900 dark:text-white">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Home, Play, Plus, User, Smartphone, Info, Sun, Moon, 
      Search, ChevronRight, ChevronLeft, Maximize2, Film, X 
    } from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';

    const CATEGORIES = ["All", "Kategori 1", "Kategori 2", "Kategori 3"];

    // Embed YouTube untuk semua konten Landscape
    const YOUTUBE_EMBED_URL = "https://www.youtube.com/embed/sG9m4Twc-ko?si=LDZ3AKqac91nPynB";
    const YOUTUBE_VIDEO_ID = "sG9m4Twc-ko";

    // Hero Banner Polosan
    const HERO_CONTENT = {
      title: "Judul Konten Utama",
      description: "Deskripsi singkat konten utama. Silakan ganti teks ini dengan sinopsis atau informasi proyek Anda."
    };

    // Chapter Polosan
    const DEFAULT_CHAPTERS = [
      { id: 1, title: 'Chapter 1', duration: '00:00', desc: 'Deskripsi chapter 1.' },
      { id: 2, title: 'Chapter 2', duration: '00:00', desc: 'Deskripsi chapter 2.' },
      { id: 3, title: 'Chapter 3', duration: '00:00', desc: 'Deskripsi chapter 3.' }
    ];

    // Data Polosan (Landscape menggunakan YouTube Embed Anda)
    const GALLERY_DATA = {
      shorts: [
        { 
          id: 'v1', 
          type: 'short',
          category: 'Kategori 1',
          title: 'Judul Short 1', 
          description: 'Deskripsi konten short 1.', 
          img: '',
          videoUrl: '',
          chapters: DEFAULT_CHAPTERS
        },
        { 
          id: 'v2', 
          type: 'short',
          category: 'Kategori 2',
          title: 'Judul Short 2', 
          description: 'Deskripsi konten short 2.', 
          img: '',
          videoUrl: '',
          chapters: DEFAULT_CHAPTERS
        },
        { 
          id: 'v3', 
          type: 'short',
          category: 'Kategori 3',
          title: 'Judul Short 3', 
          description: 'Deskripsi konten short 3.', 
          img: '',
          videoUrl: '',
          chapters: DEFAULT_CHAPTERS
        },
        { 
          id: 'v4', 
          type: 'short',
          category: 'Kategori 1',
          title: 'Judul Short 4', 
          description: 'Deskripsi konten short 4.', 
          img: '',
          videoUrl: '',
          chapters: DEFAULT_CHAPTERS
        }
      ],
      series: [
        { 
          id: 'h1', 
          type: 'series',
          category: 'Kategori 1',
          title: 'Judul Landscape 1', 
          description: 'Deskripsi konten landscape 1.', 
          img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`,
          embedUrl: YOUTUBE_EMBED_URL,
          chapters: DEFAULT_CHAPTERS
        },
        { 
          id: 'h2', 
          type: 'series',
          category: 'Kategori 2',
          title: 'Judul Landscape 2', 
          description: 'Deskripsi konten landscape 2.', 
          img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`,
          embedUrl: YOUTUBE_EMBED_URL,
          chapters: DEFAULT_CHAPTERS
        },
        { 
          id: 'h3', 
          type: 'series',
          category: 'Kategori 3',
          title: 'Judul Landscape 3', 
          description: 'Deskripsi konten landscape 3.', 
          img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`,
          embedUrl: YOUTUBE_EMBED_URL,
          chapters: DEFAULT_CHAPTERS
        },
        { 
          id: 'h4', 
          type: 'series',
          category: 'Kategori 1',
          title: 'Judul Landscape 4', 
          description: 'Deskripsi konten landscape 4.', 
          img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`,
          embedUrl: YOUTUBE_EMBED_URL,
          chapters: DEFAULT_CHAPTERS
        }
      ]
    };

    const DetailModal = ({ item, onClose, onOpenFullscreenShort }) => {
      const [isPlayingTrailer, setIsPlayingTrailer] = useState(false);

      useEffect(() => {
        setIsPlayingTrailer(false);
      }, [item]);

      if (!item) return null;

      const chapters = item.chapters || [];

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-12">
          <div 
            className="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" 
            onClick={onClose}
          ></div>
          
          <div className="relative w-full max-w-4xl max-h-[90vh] bg-white dark:bg-[#121212] rounded-2xl overflow-hidden shadow-2xl animate-zoom-in-modal flex flex-col border border-gray-200 dark:border-gray-800">
            
            <button 
              onClick={onClose} 
              className="absolute top-4 right-4 z-30 p-2 bg-black/60 hover:bg-black/90 text-white rounded-full backdrop-blur-md transition-all hover:scale-110"
            >
              <Plus size={24} className="rotate-45" />
            </button>

            {/* Header Modal: Render Iframe YouTube jika Landscape / diputar */}
            <div className="relative w-full aspect-video max-h-96 shrink-0 bg-neutral-900">
              {isPlayingTrailer ? (
                <div className="relative w-full h-full">
                  {item.embedUrl ? (
                    <iframe
                      className="w-full h-full"
                      src={`${item.embedUrl}&autoplay=1`}
                      title="YouTube video player"
                      frameBorder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                      referrerPolicy="strict-origin-when-cross-origin"
                      allowFullScreen
                    ></iframe>
                  ) : item.videoUrl ? (
                    <video 
                      src={item.videoUrl} 
                      controls 
                      autoPlay 
                      className="w-full h-full object-contain bg-black"
                    />
                  ) : (
                    <div className="w-full h-full flex items-center justify-center text-gray-400 text-sm">
                      Belum ada video (Polosan)
                    </div>
                  )}
                  <button
                    onClick={() => setIsPlayingTrailer(false)}
                    className="absolute top-4 left-4 z-30 px-3 py-1.5 bg-black/60 hover:bg-black/80 text-white text-xs font-semibold rounded-md backdrop-blur-md transition-colors"
                  >
                    Tutup Player
                  </button>
                </div>
              ) : (
                <>
                  {item.img ? (
                    <img src={item.img} alt={item.title} className="w-full h-full object-cover opacity-80" />
                  ) : (
                    <div className="w-full h-full bg-gradient-to-br from-neutral-800 to-neutral-950 flex items-center justify-center">
                      <span className="text-neutral-600 font-bold text-sm uppercase tracking-widest">Thumbnail Polosan</span>
                    </div>
                  )}
                  <div className="absolute inset-0 bg-gradient-to-t from-white via-black/20 dark:from-[#121212] to-transparent"></div>
                  
                  <div className="absolute bottom-4 left-6 md:left-10 right-6 z-10">
                    <span className="inline-block px-2.5 py-1 mb-2 text-xs font-bold uppercase tracking-wider bg-violet-600 text-white rounded">
                      {item.category}
                    </span>
                    <h2 className="text-2xl md:text-4xl font-bold text-gray-900 dark:text-white drop-shadow-lg mb-4">
                      {item.title}
                    </h2>
                    <div className="flex flex-wrap items-center gap-3 md:gap-4">
                      <button 
                        onClick={() => setIsPlayingTrailer(true)}
                        className="flex items-center gap-2 bg-white text-black px-6 py-2 md:py-2.5 rounded-md font-bold hover:bg-gray-200 transition-colors shadow-lg"
                      >
                        <Play size={18} fill="currentColor" /> Play Video
                      </button>

                      {item.type === 'short' && onOpenFullscreenShort && (
                        <button 
                          onClick={() => {
                            onClose();
                            onOpenFullscreenShort(item);
                          }}
                          className="flex items-center gap-2 bg-violet-600 hover:bg-violet-700 text-white px-5 py-2 md:py-2.5 rounded-md font-bold transition-colors shadow-lg"
                        >
                          <Maximize2 size={18} /> Fullscreen (9:16)
                        </button>
                      )}
                    </div>
                  </div>
                </>
              )}
            </div>

            <div className="p-6 md:p-10 overflow-y-auto scrollbar-hide">
              <div className="flex flex-wrap items-center gap-4 text-sm font-semibold text-gray-600 dark:text-gray-400 mb-4">
                <span>2026</span>
                <span>{chapters.length} Chapters</span>
                <span className="text-violet-600 dark:text-violet-400">{item.category}</span>
              </div>
              
              <p className="text-gray-700 dark:text-gray-300 mb-8 max-w-3xl leading-relaxed">
                {item.description}
              </p>

              <h3 className="text-xl font-bold mb-4 text-gray-900 dark:text-white flex items-center justify-between">
                <span>Chapters</span>
                <span className="text-sm font-normal text-gray-500">Daftar Episode</span>
              </h3>
              
              <div className="flex flex-col gap-2">
                {chapters.map((chap) => (
                  <div 
                    key={chap.id} 
                    onClick={() => setIsPlayingTrailer(true)}
                    className="flex items-center justify-between p-4 rounded-xl border border-gray-100 dark:border-[#222] hover:border-violet-500/50 hover:bg-gray-50 dark:hover:bg-[#1a1a1a] transition-all cursor-pointer group"
                  >
                    <div className="flex items-center gap-4 md:gap-6">
                      <span className="text-xl md:text-2xl font-bold text-gray-400 dark:text-gray-600 group-hover:text-violet-500 transition-colors w-6 text-center">
                        {chap.id}
                      </span>
                      <div>
                        <h4 className="font-semibold text-gray-900 dark:text-white group-hover:text-violet-500 transition-colors mb-0.5">
                          {chap.title}
                        </h4>
                        <p className="text-xs text-gray-500">{chap.desc}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-4">
                      <span className="text-xs font-medium text-gray-400 hidden md:block">{chap.duration}</span>
                      <button className="p-2.5 rounded-full bg-gray-100 dark:bg-[#2a2a2a] text-gray-900 dark:text-white group-hover:bg-violet-600 group-hover:text-white transition-all">
                        <Play size={14} fill="currentColor" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const ThemeContext = React.createContext();

    const ThemeProvider = ({ children }) => {
      const [isDark, setIsDark] = useState(true);

      useEffect(() => {
        const root = window.document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
      }, [isDark]);

      const toggleTheme = () => setIsDark(!isDark);

      return (
        <ThemeContext.Provider value={{ isDark, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    };

    const useTheme = () => React.useContext(ThemeContext);

    const Header = ({ activeTab, setActiveTab }) => {
      const [isScrolled, setIsScrolled] = useState(false);
      const { isDark, toggleTheme } = useTheme();

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header 
          className={`fixed top-0 w-full z-50 transition-all duration-300 ${
            isScrolled 
              ? 'bg-white/90 dark:bg-[#050505]/90 backdrop-blur-md shadow-sm dark:shadow-none' 
              : 'bg-gradient-to-b from-black/70 to-transparent'
          } py-4 px-6 md:px-12 flex justify-between items-center`}
        >
          <div className="flex items-center gap-8">
            <div 
              className="text-2xl font-bold font-sans tracking-tight cursor-pointer"
              onClick={() => setActiveTab('home')}
            >
              <span className="text-gray-900 dark:text-white">Lumi</span>
              <span className="text-violet-500" style={{ color: '#8A2BE2' }}>z</span>
            </div>
            
            <nav className="hidden md:flex gap-6 text-sm font-medium text-gray-700 dark:text-gray-300">
              <button 
                onClick={() => setActiveTab('home')} 
                className={`hover:text-violet-600 dark:hover:text-white transition-colors ${activeTab === 'home' ? 'text-violet-600 dark:text-white font-bold' : ''}`}
              >
                Home
              </button>
              <button 
                onClick={() => setActiveTab('shorts')} 
                className={`hover:text-violet-600 dark:hover:text-white transition-colors ${activeTab === 'shorts' ? 'text-violet-600 dark:text-white font-bold' : ''}`}
              >
                Shorts
              </button>
              <button 
                onClick={() => setActiveTab('series')} 
                className={`hover:text-violet-600 dark:hover:text-white transition-colors ${activeTab === 'series' ? 'text-violet-600 dark:text-white font-bold' : ''}`}
              >
                Series
              </button>
            </nav>
          </div>

          <div className="flex items-center gap-4 md:gap-6">
            <button className="text-gray-700 dark:text-white hover:text-violet-600 dark:hover:text-violet-400 transition-colors">
              <Search size={20} />
            </button>
            <button 
              onClick={toggleTheme}
              className="text-gray-700 dark:text-white hover:text-violet-600 dark:hover:text-violet-400 transition-colors"
            >
              {isDark ? <Sun size={20} /> : <Moon size={20} />}
            </button>
            <div 
              onClick={() => setActiveTab('account')}
              className="w-8 h-8 rounded-md bg-gradient-to-tr from-violet-600 to-fuchsia-500 cursor-pointer hidden md:block"
            ></div>
          </div>
        </header>
      );
    };

    const HeroBanner = () => {
      return (
        <div className="relative w-full h-[50vh] md:h-[65vh] overflow-hidden bg-gradient-to-br from-gray-200 via-gray-100 to-white dark:from-[#111111] dark:via-[#0a0a0a] dark:to-[#050505] border-b border-gray-200 dark:border-gray-800/60">
          <div className="absolute bottom-[15%] left-6 md:left-12 max-w-2xl z-10 animate-fade-in-up">
            <span className="inline-block px-3 py-1 mb-3 text-xs font-bold uppercase tracking-widest bg-violet-600/10 text-violet-600 dark:text-violet-400 border border-violet-500/20 rounded-full">
              Featured
            </span>
            <h1 className="text-4xl md:text-6xl font-bold text-gray-900 dark:text-white mb-4">
              {HERO_CONTENT.title}
            </h1>
            <p className="text-sm md:text-base text-gray-600 dark:text-gray-400 max-w-md md:max-w-xl font-medium">
              {HERO_CONTENT.description}
            </p>
          </div>
        </div>
      );
    };

    const HoverVideoCard = ({ item, isVertical, onClick }) => {
      const [isHovered, setIsHovered] = useState(false);
      const videoRef = useRef(null);

      useEffect(() => {
        let playPromise;
        if (isHovered && videoRef.current && item.videoUrl) {
          videoRef.current.currentTime = 0;
          playPromise = videoRef.current.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {});
          }
        } else if (!isHovered && videoRef.current && item.videoUrl) {
          videoRef.current.pause();
        }
      }, [isHovered, item.videoUrl]);

      return (
        <div
          className={`relative cursor-pointer overflow-hidden rounded-lg bg-gray-200 dark:bg-[#141414] border border-gray-300/60 dark:border-gray-800 group shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 ${
            isVertical ? 'aspect-[9/16]' : 'aspect-video'
          }`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          onClick={() => onClick(item)}
        >
          {/* Layer 1: Jika memiliki YouTube Embed URL, tampilkan iframe saat di-hover */}
          {item.embedUrl && isHovered ? (
            <iframe
              className="absolute inset-0 w-full h-full z-0 pointer-events-none"
              src={`${item.embedUrl}&autoplay=1&mute=1&controls=0&modestbranding=1`}
              title={item.title}
              frameBorder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerPolicy="strict-origin-when-cross-origin"
            ></iframe>
          ) : item.videoUrl ? (
            <video
              ref={videoRef}
              src={item.videoUrl}
              muted
              loop
              playsInline
              className="absolute inset-0 w-full h-full object-cover z-0"
            />
          ) : null}

          {/* Layer 2: Poster atau Polosan */}
          {item.img ? (
            <img
              src={item.img}
              alt={item.title}
              className={`absolute inset-0 w-full h-full object-cover z-10 transition-opacity duration-500 ease-in-out ${
                isHovered && (item.embedUrl || item.videoUrl) ? 'opacity-0' : 'opacity-100'
              }`}
            />
          ) : (
            <div className="absolute inset-0 w-full h-full bg-gradient-to-b from-gray-200 to-gray-300 dark:from-[#1a1a1a] dark:to-[#111111] z-10 flex items-center justify-center">
              <span className="text-xs font-semibold text-gray-400 dark:text-gray-600 uppercase tracking-widest">
                {isVertical ? '9:16 Polosan' : '16:9 Polosan'}
              </span>
            </div>
          )}

          {/* Badge Kategori */}
          <div className="absolute top-2 left-2 md:top-3 md:left-3 z-20">
            <span className="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-black/60 text-white rounded backdrop-blur-sm border border-white/10">
              {item.category}
            </span>
          </div>

          {/* Ikon Play Center */}
          <div className={`absolute inset-0 z-20 flex items-center justify-center transition-opacity duration-300 ${isHovered ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-10 h-10 md:w-12 md:h-12 bg-black/40 rounded-md flex items-center justify-center backdrop-blur-sm border border-white/20">
              <Play size={20} className="text-white ml-1 opacity-80" fill="currentColor" />
            </div>
          </div>

          {/* Info Saat Hover */}
          <div className={`absolute inset-0 z-30 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-4 md:p-5 transition-opacity duration-300 ${isHovered ? 'opacity-100' : 'opacity-0'}`}>
            <div className="transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300">
              <h3 className="text-white font-bold text-sm md:text-base drop-shadow-md mb-1">{item.title}</h3>
              <p className="text-gray-300 text-[10px] md:text-xs line-clamp-2 mb-2">
                {item.description}
              </p>
              <div className="flex gap-2 items-center">
                <span className="text-[10px] font-semibold bg-white text-black px-2 py-0.5 rounded">Play</span>
                <span className="text-[10px] font-medium text-violet-300">{item.chapters?.length || 0} Chapters</span>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const StudioGallery = ({ onItemClick }) => {
      const [selectedCategory, setSelectedCategory] = useState("All");
      const verticalScrollRef = useRef(null);

      const filteredShorts = selectedCategory === "All" 
        ? GALLERY_DATA.shorts 
        : GALLERY_DATA.shorts.filter(item => item.category === selectedCategory);

      const filteredSeries = selectedCategory === "All" 
        ? GALLERY_DATA.series 
        : GALLERY_DATA.series.filter(item => item.category === selectedCategory);

      const scrollVerticalRow = (direction) => {
        if (verticalScrollRef.current) {
          const scrollAmount = 320;
          verticalScrollRef.current.scrollBy({
            left: direction === 'left' ? -scrollAmount : scrollAmount,
            behavior: 'smooth'
          });
        }
      };

      const specificCategories = CATEGORIES.filter(cat => cat !== "All");

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 py-12 md:py-20 space-y-16">
          
          <div className="text-center space-y-6">
            <div>
              <p className="text-[10px] md:text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-[0.2em] mb-2">Our Output</p>
              <h2 className="text-3xl md:text-5xl font-black text-gray-900 dark:text-white uppercase tracking-tight">Studio Gallery</h2>
            </div>

            <div className="flex flex-wrap justify-center gap-2 md:gap-3 pt-2">
              {CATEGORIES.map((category) => (
                <button
                  key={category}
                  onClick={() => setSelectedCategory(category)}
                  className={`px-5 py-2 rounded-full text-xs md:text-sm font-bold transition-all ${
                    selectedCategory === category
                      ? 'bg-violet-600 text-white shadow-lg shadow-violet-600/30'
                      : 'bg-gray-200 dark:bg-[#161616] text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-[#222]'
                  }`}
                >
                  {category}
                </button>
              ))}
            </div>
          </div>

          {/* Section 1: Vertical Content (9:16) */}
          <div className="space-y-6">
            <div className="flex items-center justify-between">
              <h3 className="text-sm md:text-lg font-bold text-gray-900 dark:text-white uppercase tracking-wider">
                Vertical Content (9:16)
              </h3>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => scrollVerticalRow('left')}
                  className="p-2 rounded-full bg-gray-200 dark:bg-[#1a1a1a] text-gray-800 dark:text-white hover:bg-violet-600 hover:text-white transition-colors"
                >
                  <ChevronLeft size={20} />
                </button>
                <button
                  onClick={() => scrollVerticalRow('right')}
                  className="p-2 rounded-full bg-gray-200 dark:bg-[#1a1a1a] text-gray-800 dark:text-white hover:bg-violet-600 hover:text-white transition-colors"
                >
                  <ChevronRight size={20} />
                </button>
              </div>
            </div>

            <div 
              ref={verticalScrollRef}
              className="flex gap-4 md:gap-6 overflow-x-auto scrollbar-hide snap-x snap-mandatory pb-2"
            >
              {filteredShorts.map((item) => (
                <div key={item.id} className="w-[45%] sm:w-[30%] md:w-[23%] shrink-0 snap-start">
                  <HoverVideoCard item={item} isVertical={true} onClick={onItemClick} />
                </div>
              ))}
            </div>
          </div>

          {/* Section 2: Cinematic Landscape (16:9) - Menggunakan YouTube Embed */}
          <div className="space-y-6">
            <h3 className="text-sm md:text-lg font-bold text-gray-900 dark:text-white uppercase tracking-wider">
              Cinematic Landscape (16:9)
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
              {filteredSeries.map((item) => (
                <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} />
              ))}
            </div>
          </div>

          {/* Section 3: Per Kategori */}
          <div className="space-y-12 pt-8 border-t border-gray-200 dark:border-gray-800/80">
            <h3 className="text-2xl md:text-3xl font-black text-gray-900 dark:text-white uppercase tracking-tight">
              Explore By Category
            </h3>

            {specificCategories.map((cat) => {
              const catShorts = GALLERY_DATA.shorts.filter(item => item.category === cat);
              const catSeries = GALLERY_DATA.series.filter(item => item.category === cat);

              return (
                <div key={cat} className="space-y-6">
                  <div className="flex items-center justify-between border-l-4 border-violet-600 pl-3">
                    <h4 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white">
                      {cat}
                    </h4>
                    <span className="text-xs font-medium text-gray-500">
                      {catShorts.length + catSeries.length} Item
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    {catSeries.map((item) => (
                      <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} />
                    ))}
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                    {catShorts.map((item) => (
                      <HoverVideoCard key={item.id} item={item} isVertical={true} onClick={onItemClick} />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

        </div>
      );
    };

    const ShortsCatalogPage = ({ onItemClick, onOpenFullscreen }) => {
      const specificCategories = CATEGORIES.filter(cat => cat !== "All");

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 pt-24 pb-16 space-y-12 animate-fade-in">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-gray-200 dark:border-gray-800 pb-6">
            <div>
              <p className="text-xs font-bold text-violet-500 uppercase tracking-[0.2em] mb-2">Vertical Format (9:16)</p>
              <h1 className="text-3xl md:text-5xl font-black text-gray-900 dark:text-white uppercase tracking-tight">
                Shorts Catalog
              </h1>
            </div>
            <button
              onClick={() => onOpenFullscreen(GALLERY_DATA.shorts[0])}
              className="flex items-center gap-2 self-start md:self-auto bg-violet-600 hover:bg-violet-700 text-white px-5 py-2.5 rounded-full text-sm font-bold transition-all"
            >
              <Smartphone size={18} /> Buka Feed Layar Penuh
            </button>
          </div>

          {specificCategories.map((cat) => {
            const items = GALLERY_DATA.shorts.filter(short => short.category === cat);
            if (items.length === 0) return null;

            return (
              <div key={cat} className="space-y-4">
                <h2 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wider">
                  {cat}
                </h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
                  {items.map((item) => (
                    <HoverVideoCard key={item.id} item={item} isVertical={true} onClick={onItemClick} />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const SeriesCatalogPage = ({ onItemClick }) => {
      const specificCategories = CATEGORIES.filter(cat => cat !== "All");

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 pt-24 pb-16 space-y-12 animate-fade-in">
          <div className="border-b border-gray-200 dark:border-gray-800 pb-6">
            <p className="text-xs font-bold text-violet-500 uppercase tracking-[0.2em] mb-2">Widescreen Format (16:9)</p>
            <h1 className="text-3xl md:text-5xl font-black text-gray-900 dark:text-white uppercase tracking-tight">
              Series Catalog
            </h1>
          </div>

          {specificCategories.map((cat) => {
            const items = GALLERY_DATA.series.filter(ser => ser.category === cat);
            if (items.length === 0) return null;

            return (
              <div key={cat} className="space-y-4">
                <h2 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wider">
                  {cat}
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                  {items.map((item) => (
                    <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const ShortsView = ({ initialShort, onClose, onSelectInfo }) => {
      const orderedShorts = initialShort
        ? [initialShort, ...GALLERY_DATA.shorts.filter(s => s.id !== initialShort.id)]
        : GALLERY_DATA.shorts;

      return (
        <div className="fixed inset-0 z-[90] bg-black/95 flex justify-center items-center backdrop-blur-xl animate-fade-in">
          <button
            onClick={onClose}
            className="absolute top-5 right-5 z-[100] flex items-center gap-2 px-4 py-2 rounded-full bg-white/15 hover:bg-white/25 text-white text-xs font-bold backdrop-blur-md transition-all"
          >
            <X size={18} /> Tutup Player
          </button>

          <div className="w-full h-[100dvh] md:h-[88vh] md:max-w-[calc(88vh*9/16)] md:rounded-2xl overflow-y-scroll snap-y snap-mandatory scrollbar-hide relative bg-neutral-900 md:border md:border-gray-800 shadow-2xl">
            {orderedShorts.map((short) => (
              <div key={short.id} className="h-[100dvh] md:h-full w-full snap-start snap-always relative flex items-center justify-center bg-neutral-950 overflow-hidden">
                <span className="text-neutral-600 text-xs font-bold uppercase tracking-widest">
                  Area Video 9:16 Polosan
                </span>
                <div className="absolute right-4 bottom-24 flex flex-col gap-6 items-center z-10">
                  <button 
                    onClick={() => onSelectInfo(short)}
                    className="p-3 rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-violet-600 transition-all"
                  >
                    <Info size={24} />
                  </button>
                </div>
                <div className="absolute bottom-20 left-4 right-20 z-10">
                  <span className="inline-block px-2 py-0.5 mb-2 text-[10px] font-bold uppercase bg-violet-600 text-white rounded">
                    {short.category}
                  </span>
                  <h3 className="text-white font-bold text-lg mb-1">{short.title}</h3>
                  <p className="text-gray-400 text-xs">{short.description}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const Footer = () => (
      <footer className="w-full py-8 px-6 border-t border-gray-200 dark:border-gray-800/80 bg-white dark:bg-[#050505] text-center">
        <p className="text-xs md:text-sm text-gray-500 dark:text-gray-400 font-medium tracking-wide">
          <span className="font-bold text-gray-900 dark:text-white">
            Lumi<span className="text-violet-500" style={{ color: '#8A2BE2' }}>z</span>
          </span>{' '}
          — Produced by Lumiztudio | Supervised by Nezen | Part of Luminanze &amp; ZK Group
        </p>
      </footer>
    );

    const BottomNav = ({ activeTab, setActiveTab }) => {
      return (
        <div className="md:hidden fixed bottom-0 w-full bg-white/90 dark:bg-[#121212]/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 z-50 pb-safe">
          <div className="flex justify-around items-center h-16">
            <button 
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'home' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <Home size={22} />
              <span className="text-[10px] font-medium mt-1">Home</span>
            </button>
            <button 
              onClick={() => setActiveTab('shorts')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'shorts' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <Smartphone size={22} />
              <span className="text-[10px] font-medium mt-1">Shorts</span>
            </button>
            <button 
              onClick={() => setActiveTab('series')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'series' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <Film size={22} />
              <span className="text-[10px] font-medium mt-1">Series</span>
            </button>
            <button 
              onClick={() => setActiveTab('account')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'account' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <User size={22} />
              <span className="text-[10px] font-medium mt-1">Account</span>
            </button>
          </div>
        </div>
      );
    };

    const MainApp = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedItem, setSelectedItem] = useState(null);
      const [fullscreenShort, setFullscreenShort] = useState(null);

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 dark:bg-[#050505] text-gray-900 dark:text-white font-sans selection:bg-violet-500/30">
          <Header activeTab={activeTab} setActiveTab={setActiveTab} />

          <main className="flex-grow pb-20 md:pb-8">
            {activeTab === 'home' && (
              <div className="animate-fade-in">
                <HeroBanner />
                <StudioGallery onItemClick={(item) => setSelectedItem(item)} />
              </div>
            )}

            {activeTab === 'shorts' && (
              <ShortsCatalogPage 
                onItemClick={(item) => setSelectedItem(item)} 
                onOpenFullscreen={(shortItem) => setFullscreenShort(shortItem)}
              />
            )}

            {activeTab === 'series' && (
              <SeriesCatalogPage 
                onItemClick={(item) => setSelectedItem(item)} 
              />
            )}

            {activeTab === 'account' && (
              <div className="pt-24 px-6 md:px-12 flex flex-col items-center justify-center h-[75vh] animate-fade-in">
                <div className="w-24 h-24 rounded-full bg-neutral-800 mb-6"></div>
                <h2 className="text-2xl font-bold mb-2">User Profile</h2>
              </div>
            )}
          </main>

          <Footer />
          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />

          {fullscreenShort && (
            <ShortsView 
              initialShort={fullscreenShort} 
              onClose={() => setFullscreenShort(null)}
              onSelectInfo={(item) => setSelectedItem(item)}
            />
          )}

          <DetailModal 
            item={selectedItem} 
            onClose={() => setSelectedItem(null)} 
            onOpenFullscreenShort={(shortItem) => setFullscreenShort(shortItem)}
          />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(
      <ThemeProvider>
        <MainApp />
      </ThemeProvider>
    );
  </script>
</body>
</html>
