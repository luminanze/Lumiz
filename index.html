    const getDriveFileId = (url) => {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);

    // ==========================================
    // 5. MODAL DETAIL (SINOPSIS, CHAPTER & PEMUTAR DRIVE)
    // ==========================================
    const DetailModal = ({ item, onClose }) => {
      const [activeVideoUrl, setActiveVideoUrl] = useState(null);

      useEffect(() => {
        setActiveVideoUrl(null);
      }, [item]);

      if (!item) return null;

      const chapters = item.chapters && item.chapters.length > 0 ? item.chapters : [
        { id: 1, title: 'Chapter 1: Pilot Episode', duration: '15m', drive_url: item.video_url }

    // ==========================================
    // 6. MODAL FORM TAMBAH & EDIT VIDEO (ADMIN)
    // ==========================================
    const AdminFormModal = ({ isOpen, onClose, initialData, onSaved }) => {
      const [formData, setFormData] = useState({
        type: 'short', category: 'Cyberpunk', title: '', description: '', img: '', video_url: '',
        chapters: [{ id: 1, title: 'Chapter 1', duration: '10m', drive_url: '' }]
      });
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (initialData) {
          setFormData({
            ...initialData,
            chapters: initialData.chapters?.length ? initialData.chapters : [{ id: 1, title: 'Chapter 1', duration: '10m', drive_url: '' }]
          });
        } else {
          setFormData({
            type: 'short', category: 'Cyberpunk', title: '', description: '', img: '', video_url: '',
            chapters: [{ id: 1, title: 'Chapter 1', duration: '10m', drive_url: '' }]
          });
        }
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      const handleAddChapter = () => {
        setFormData({
          ...formData,
          chapters: [...formData.chapters, { id: formData.chapters.length + 1, title: `Chapter ${formData.chapters.length + 1}`, duration: '15m', drive_url: '' }]
        });
      };

      const handleChapterChange = (index, field, value) => {
        const updated = [...formData.chapters];
        updated[index][field] = value;
        setFormData({ ...formData, chapters: updated });
      };

      const handleRemoveChapter = (index) => {
        setFormData({ ...formData, chapters: formData.chapters.filter((_, i) => i !== index) });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);
        const payload = {
          type: formData.type,
          category: formData.category,
          title: formData.title,
          description: formData.description,
          img: formData.img,
          video_url: formData.video_url,
          chapters: formData.chapters
        };

        let error;
        if (initialData && typeof initialData.id === 'number') {
          ({ error } = await supabase.from('lumiz_catalog').update(payload).eq('id', initialData.id));
        } else {
          ({ error } = await supabase.from('lumiz_catalog').insert([payload]));
        }

        setSaving(false);
        if (error) {
          alert('Gagal menyimpan ke Supabase: ' + error.message);
        } else {
          onSaved();
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#141414] border border-[#8A2BE2]/40 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto text-white shadow-2xl">
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-3">
              <h3 className="text-xl font-bold">
                {initialData ? '✏️ Edit Tayangan Lumiz' : '+ Tambah Tayangan Baru ke Supabase'}
              </h3>
              <button onClick={onClose} className="p-1.5 hover:bg-white/10 rounded-full"><IconX /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-sm">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-gray-400 mb-1 font-semibold">Format Tayangan</label>
                  <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white">
                    <option value="short">Shorts (Vertikal 9:16)</option>
                    <option value="series">Series (Landscape 16:9)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-gray-400 mb-1 font-semibold">Kategori / Genre</label>
                  <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white">
                    <option value="Origin">Origin</option>
                    <option value="Cyberpunk">Cyberpunk</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Action">Action</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-gray-400 mb-1 font-semibold">Judul Tayangan</label>
                <input required type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="Contoh: Neon Echoes" className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white" />
              </div>

              <div>
                <label className="block text-gray-400 mb-1 font-semibold">Sinopsis Lengkap</label>
                <textarea required rows="3" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} placeholder="Tulis sinopsis cerita di sini..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white"></textarea>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-gray-400 mb-1 font-semibold">Link Gambar Poster (URL)</label>
                  <input required type="url" value={formData.img} onChange={e => setFormData({...formData, img: e.target.value})} placeholder="https://..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white" />
                </div>
                <div>
                  <label className="block text-gray-400 mb-1 font-semibold">Link Video Trailer Hover (MP4 / Drive)</label>
                  <input required type="url" value={formData.video_url} onChange={e => setFormData({...formData, video_url: e.target.value})} placeholder="https://..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white" />
                </div>
              </div>

              <div className="pt-3 border-t border-white/10">
                <div className="flex justify-between items-center mb-2">
                  <label className="font-bold text-gray-300">Daftar Chapter & Link Google Drive</label>
                  <button type="button" onClick={handleAddChapter} className="text-xs bg-[#8A2BE2]/20 text-[#8A2BE2] border border-[#8A2BE2]/40 px-3 py-1 rounded-md hover:bg-[#8A2BE2] hover:text-white transition">
                    + Tambah Chapter
                  </button>
                </div>
                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                  {formData.chapters.map((chap, idx) => (
                    <div key={idx} className="flex gap-2 items-center bg-[#0A0A0A] p-2 rounded-lg border border-white/10">
                      <input type="text" value={chap.title} onChange={e => handleChapterChange(idx, 'title', e.target.value)} placeholder="Judul Chapter" className="w-1/3 bg-transparent border-b border-white/20 p-1 text-xs focus:outline-none text-white" />
                      <input type="text" value={chap.duration} onChange={e => handleChapterChange(idx, 'duration', e.target.value)} placeholder="Durasi (15m)" className="w-16 bg-transparent border-b border-white/20 p-1 text-xs focus:outline-none text-white" />
                      <input type="text" value={chap.drive_url} onChange={e => handleChapterChange(idx, 'drive_url', e.target.value)} placeholder="Paste Link Google Drive / MP4" className="flex-1 bg-transparent border-b border-white/20 p-1 text-xs focus:outline-none text-white" />
                      {formData.chapters.length > 1 && (
                        <button type="button" onClick={() => handleRemoveChapter(idx)} className="text-red-400 hover:text-red-300 p-1"><IconTrash /></button>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex justify-end gap-3 pt-4">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20">Batal</button>
                <button type="submit" disabled={saving} className="px-6 py-2 rounded-lg bg-[#8A2BE2] hover:bg-violet-700 font-bold text-white shadow-lg">
                  {saving ? 'Menyimpan...' : 'Simpan ke Database'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 7. KARTU VIDEO INTERAKTIF (HOVER TRAILER + TOMBOL ADMIN)
    // ==========================================
    const HoverVideoCard = ({ item, isVertical, onClick, isAdmin, onEdit, onDelete }) => {
      const [isHovered, setIsHovered] = useState(false);
      const videoRef = useRef(null);

      useEffect(() => {
        if (isHovered && videoRef.current) {
          videoRef.current.currentTime = 0;
          const playPromise = videoRef.current.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {});
          }
        } else if (!isHovered && videoRef.current) {
          videoRef.current.pause();
        }
      }, [isHovered]);

      return (
        <div
          className={`relative cursor-pointer overflow-hidden rounded-xl bg-[#141414] group shadow-md hover:shadow-xl border border-white/5 hover:border-[#8A2BE2]/80 transition-all duration-300 transform hover:-translate-y-1 ${
            isVertical ? 'aspect-[9/16]' : 'aspect-video'
          }`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          onClick={() => onClick(item)}
        >
          <video
            ref={videoRef}
            src={getDirectMediaUrl(item.video_url)}
            muted
            loop
            playsInline
            className="absolute inset-0 w-full h-full object-cover z-0"
          />

          <img
            src={item.img}
            alt={item.title}
            className={`absolute inset-0 w-full h-full object-cover z-10 transition-opacity duration-500 ease-in-out ${
              isHovered ? 'opacity-0' : 'opacity-100'
            }`}
          />

          {isAdmin && (
            <div className="absolute top-2.5 left-2.5 z-40 flex gap-1.5" onClick={e => e.stopPropagation()}>
              <button onClick={() => onEdit(item)} className="p-2 rounded-lg bg-black/80 hover:bg-[#8A2BE2] text-white border border-white/20 shadow-md transition" title="Edit Video">
                <IconEdit />
              </button>
              <button onClick={() => onDelete(item.id)} className="p-2 rounded-lg bg-black/80 hover:bg-red-600 text-white border border-white/20 shadow-md transition" title="Hapus Video">
                <IconTrash />
              </button>
            </div>
          )}

          <div className={`absolute inset-0 z-20 flex items-center justify-center transition-opacity duration-300 ${isHovered ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-11 h-11 md:w-12 md:h-12 bg-black/65 rounded-xl flex items-center justify-center backdrop-blur-sm border border-white/20 shadow-lg text-white">
              <IconPlay />
            </div>
          </div>

          <div className={`absolute top-2.5 right-2.5 z-20 transition-opacity duration-300 ${isHovered ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-7 h-7 bg-black/60 rounded-md flex items-center justify-center backdrop-blur-sm text-white/80 border border-white/10">
              <IconExpand />
            </div>
          </div>

          <div className="absolute inset-x-0 bottom-0 z-30 bg-gradient-to-t from-black/95 via-black/60 to-transparent p-4 flex flex-col justify-end">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-[10px] font-bold uppercase tracking-wider bg-[#8A2BE2] text-white px-2 py-0.5 rounded">
                {item.category || 'Lumiz'}
              </span>
              {isHovered && (
                <span className="text-[10px] font-semibold bg-white/20 text-white px-2 py-0.5 rounded backdrop-blur-sm">
                  Muted Trailer
                </span>
              )}
            </div>
            <h3 className="text-white font-bold text-sm md:text-base drop-shadow-md truncate">{item.title}</h3>
            <p className={`text-gray-300 text-xs line-clamp-2 mt-1 transition-all duration-300 ${isHovered ? 'block' : 'hidden'}`}>
              {item.description}
            </p>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. STUDIO GALLERY (HOME, SHORTS PAGE, & SERIES PAGE)
    // ==========================================
    const StudioGallery = ({ items, viewMode, onItemClick, isAdmin, onAddClick, onEditClick, onDeleteClick }) => {
      const [selectedCat, setSelectedCat] = useState('All');
      const shortsScrollRef = useRef(null);

      const filteredItems = selectedCat === 'All' 
        ? items 
        : items.filter(i => i.category?.toLowerCase() === selectedCat.toLowerCase());

      const shortsList = filteredItems.filter(i => i.type === 'short');
      const seriesList = filteredItems.filter(i => i.type === 'series');

      const scrollShorts = (dir) => {
        if (shortsScrollRef.current) {
          shortsScrollRef.current.scrollBy({ left: dir * 300, behavior: 'smooth' });
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 py-12 space-y-14">
          
          <div className="text-center">
            <p className="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-1">
              OUR OUTPUT — LUMI<span className="text-[#8A2BE2]">Z</span>TUDIO
            </p>
            <h2 className="text-3xl md:text-5xl font-black text-white uppercase tracking-tight">
              {viewMode === 'shorts' ? 'SHORTS GALLERY (9:16)' : viewMode === 'series' ? 'SERIES GALLERY (16:9)' : 'STUDIO GALLERY'}
            </h2>
            <p className="text-xs md:text-sm text-gray-400 mt-2 max-w-xl mx-auto">
              Arahkan kursor (hover) pada video untuk memutar trailer tanpa suara. Klik kartu untuk melihat sinopsis dan daftar chapter.
            </p>

            <div className="flex flex-wrap items-center justify-center gap-2 mt-6">
              {CATEGORIES.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCat(cat)}
                  className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${
                    selectedCat === cat 
                      ? 'bg-[#8A2BE2] text-white shadow-lg shadow-[#8A2BE2]/30' 
                      : 'bg-[#141414] text-gray-300 hover:bg-[#8A2BE2]/20 border border-white/10'
                  }`}
                >
                  {cat}
                </button>
              ))}

              {isAdmin && (
                <button
                  onClick={onAddClick}
                  className="ml-2 flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition"
                >
                  <IconPlus /> Tambah Video (Admin)
                </button>
              )}
            </div>
          </div>

          {(viewMode === 'home' || viewMode === 'shorts') && (
            <div className="space-y-4 relative">
              <div className="flex items-center justify-between">
                <h3 className="text-xs md:text-sm font-extrabold text-white uppercase tracking-wider">
                  VERTICAL CONTENT (9:16) — SHORTS
                </h3>
                <span className="text-xs text-gray-400">{shortsList.length} Judul</span>
              </div>

              {viewMode === 'home' ? (
                <div className="relative">
                  <button 
                    onClick={() => scrollShorts(-1)}
                    className="absolute -left-4 top-1/2 -translate-y-1/2 z-30 w-9 h-9 rounded-full bg-white text-black shadow-xl flex items-center justify-center hover:scale-110 transition"
                  >
                    <IconLeft />
                  </button>

                  <div ref={shortsScrollRef} className="flex gap-5 overflow-x-auto scrollbar-hide scroll-smooth py-2">
                    {shortsList.map(item => (
                      <div key={item.id} className="min-w-[210px] sm:min-w-[250px] md:min-w-[265px]">
                        <HoverVideoCard item={item} isVertical={true} onClick={onItemClick} isAdmin={isAdmin} onEdit={onEditClick} onDelete={onDeleteClick} />
                      </div>
                    ))}
                  </div>

                  <button 
                    onClick={() => scrollShorts(1)}
                    className="absolute -right-4 top-1/2 -translate-y-1/2 z-30 w-9 h-9 rounded-full bg-white text-black shadow-xl flex items-center justify-center hover:scale-110 transition"
                  >
                    <IconRight />
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-2 md:grid-cols-4 gap-5">
                  {shortsList.map(item => (
                    <HoverVideoCard key={item.id} item={item} isVertical={true} onClick={onItemClick} isAdmin={isAdmin} onEdit={onEditClick} onDelete={onDeleteClick} />
                  ))}
                </div>
              )}
            </div>
          )}

          {(viewMode === 'home' || viewMode === 'series') && (
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h3 className="text-xs md:text-sm font-extrabold text-white uppercase tracking-wider">
                  CINEMATIC LANDSCAPE (16:9) — SERIES
                </h3>
                <span className="text-xs text-gray-400">{seriesList.length} Judul</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {seriesList.map(item => (
                  <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} isAdmin={isAdmin} onEdit={onEditClick} onDelete={onDeleteClick} />
                ))}
              </div>
            </div>
          )}

          {viewMode === 'home' && selectedCat === 'All' && (
            <div className="pt-8 border-t border-white/10 space-y-12">
              {CATEGORIES.filter(c => c !== 'All').map(categoryName => {
                const catItems = items.filter(i => i.category?.toLowerCase() === categoryName.toLowerCase());
                if (catItems.length === 0) return null;
                return (
                  <div key={categoryName} className="space-y-4">
                    <h3 className="text-sm md:text-base font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-[#8A2BE2]"></span>
                      Kategori: {categoryName}
                    </h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      {catItems.map(item => (
                        <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} isAdmin={isAdmin} onEdit={onEditClick} onDelete={onDeleteClick} />
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

        </div>
      );
    };

    // ==========================================
    // 9. HEADER & MAIN APP
    // ==========================================
    const Header = ({ activeTab, setActiveTab, isAdmin, onAddClick }) => {
      const [isScrolled, setIsScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <header className={`fixed top-0 w-full z-50 transition-all duration-300 ${
          isScrolled ? 'bg-[#0A0A0A]/95 backdrop-blur-md border-b border-white/10' : 'bg-gradient-to-b from-black/80 to-transparent'
        } py-4 px-6 md:px-12 flex justify-between items-center`}>
          <div className="flex items-center gap-8">
            <div className="text-2xl font-black tracking-tight cursor-pointer select-none" onClick={() => setActiveTab('home')}>
              <span className="text-white">LUMI</span>
              <span className="text-[#8A2BE2] drop-shadow-[0_0_8px_rgba(138,43,226,0.8)]">Z</span>
            </div>
            
            <nav className="hidden md:flex gap-6 text-sm font-semibold text-gray-300">
              <button onClick={() => setActiveTab('home')} className={`hover:text-[#8A2BE2] transition-colors ${activeTab === 'home' ? 'text-[#8A2BE2] font-bold' : ''}`}>Home</button>
              <button onClick={() => setActiveTab('shorts')} className={`hover:text-[#8A2BE2] transition-colors ${activeTab === 'shorts' ? 'text-[#8A2BE2] font-bold' : ''}`}>Shorts (9:16)</button>
              <button onClick={() => setActiveTab('series')} className={`hover:text-[#8A2BE2] transition-colors ${activeTab === 'series' ? 'text-[#8A2BE2] font-bold' : ''}`}>Series (16:9)</button>
            </nav>
          </div>

          <div className="flex items-center gap-4">
            {isAdmin && (
              <button onClick={onAddClick} className="hidden sm:flex items-center gap-1 text-xs font-bold bg-[#8A2BE2] hover:bg-violet-700 text-white px-3 py-1.5 rounded-lg transition">
                <IconPlus /> Upload Video
              </button>
            )}
            <div onClick={() => setActiveTab('account')} className="px-3 py-1.5 rounded-lg bg-[#8A2BE2] flex items-center justify-center text-white font-bold text-xs cursor-pointer shadow-md">
              {isAdmin ? 'ADMIN' : 'Account'}
            </div>
          </div>
        </header>
      );
    };

    const MainApp = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [catalog, setCatalog] = useState(FALLBACK_DATA);
      const [selectedItem, setSelectedItem] = useState(null);
      
      const [user, setUser] = useState(null);
      const [adminModalOpen, setAdminModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const isAdmin = user && ADMIN_EMAILS.includes(user.email?.toLowerCase());

      const fetchCatalog = async () => {
        const { data, error } = await supabase
          .from('lumiz_catalog')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data && data.length > 0) {
          setCatalog(data);
        }
      };

      useEffect(() => {
        fetchCatalog();

        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        const redirectUrl = window.location.origin + window.location.pathname;
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: redirectUrl }
        });
        if (error) alert('Gagal membuka login Google: ' + error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
      };

      const handleDeleteVideo = async (id) => {
        if (!window.confirm('Yakin ingin menghapus tayangan ini dari database Lumiz?')) return;
        const { error } = await supabase.from('lumiz_catalog').delete().eq('id', id);
        if (!error) {
          setCatalog(catalog.filter(i => i.id !== id));
        } else {
          alert('Gagal menghapus: ' + error.message);
        }
      };

      return (
        <div className="min-h-screen bg-[#0A0A0A] text-white font-sans">
          
          <Header 
            activeTab={activeTab} 
            setActiveTab={setActiveTab} 
            isAdmin={isAdmin} 
            onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }} 
          />

          <main className="pb-24 md:pb-12">
            {activeTab === 'home' && (
              <div>
                <div className="relative w-full h-[55vh] md:h-[70vh] overflow-hidden bg-black">
                  <img src={HERO_CONTENT.imageUrl} alt="Hero" className="absolute inset-0 w-full h-full object-cover opacity-50" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#0A0A0A] via-transparent to-transparent" />
                  <div className="absolute bottom-[12%] left-6 md:left-12 max-w-2xl z-10">
                    <span className="text-xs font-bold uppercase tracking-widest px-3 py-1 rounded bg-[#8A2BE2] text-white mb-3 inline-block">
                      Lumiz Original
                    </span>
                    <h1 className="text-4xl md:text-6xl font-black text-white mb-3">
                      {HERO_CONTENT.title}
                    </h1>
                    <p className="text-sm md:text-base text-gray-300 max-w-xl">
                      {HERO_CONTENT.description}
                    </p>
                  </div>
                </div>

                <StudioGallery 
                  items={catalog} 
                  viewMode="home" 
                  onItemClick={setSelectedItem}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteVideo}
                />
              </div>
            )}

            {activeTab === 'shorts' && (
              <div className="pt-20">
                <StudioGallery 
                  items={catalog} 
                  viewMode="shorts" 
                  onItemClick={setSelectedItem}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteVideo}
                />
              </div>
            )}

            {activeTab === 'series' && (
              <div className="pt-20">
                <StudioGallery 
                  items={catalog} 
                  viewMode="series" 
                  onItemClick={setSelectedItem}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteVideo}
                />
              </div>
            )}

            {activeTab === 'account' && (
              <div className="pt-28 px-6 flex flex-col items-center justify-center min-h-[75vh] text-center">
                {user ? (
                  <div className="max-w-md w-full bg-[#141414] p-6 rounded-2xl border border-white/10 shadow-xl">
                    <h2 className="text-xl font-bold mb-1">{user.user_metadata?.full_name || 'Lumiz User'}</h2>
                    <p className="text-sm text-gray-400 mb-4">{user.email}</p>

                    {isAdmin ? (
                      <div className="mb-6 p-3 rounded-xl bg-[#8A2BE2]/20 border border-[#8A2BE2] text-xs text-violet-300 font-semibold">
                        ✓ Status: Admin Resmi Lumiztudio. Fitur Tambah, Edit, dan Hapus Video aktif di Galeri.
                      </div>
                    ) : (
                      <div className="mb-6 p-3 rounded-xl bg-white/5 text-xs text-gray-400">
                        Status: Penonton Reguler
                      </div>
                    )}

                    <div className="flex flex-col gap-3">
                      {isAdmin && (
                        <button 
                          onClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                          className="w-full py-2.5 rounded-xl bg-[#8A2BE2] hover:bg-violet-700 text-white font-bold transition"
                        >
                          + Upload Video Baru
                        </button>
                      )}
                      <button onClick={handleLogout} className="w-full py-2.5 rounded-xl border border-red-500/40 text-red-400 hover:bg-red-500/10 font-semibold transition">
                        Keluar (Sign Out)
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="max-w-md w-full bg-[#141414] p-8 rounded-2xl border border-white/10 shadow-xl">
                    <h2 className="text-2xl font-bold mb-2">Masuk ke Lumi<span className="text-[#8A2BE2]">z</span></h2>
                    <p className="text-xs text-gray-400 mb-6">
                      Login menggunakan akun Google (`keano.dranantya@gmail.com` atau `luminanze.team@gmail.com`) untuk mengaktifkan tombol kelola video.
                    </p>
                    <button 
                      onClick={handleGoogleLogin}
                      className="w-full py-3 px-6 rounded-xl bg-white text-black font-bold hover:bg-gray-200 transition flex items-center justify-center gap-3 shadow-lg"
                    >
                      Masuk dengan Google
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="border-t border-white/10 py-8 px-6 text-center text-xs text-gray-500">
            © 2026 Lumi<span className="text-[#8A2BE2] font-bold">z</span> Streaming Network. Produced by Lumi<span className="text-[#8A2BE2] font-bold">z</span>tudio | Supervised by Nezen | Part of Luminan<span className="text-[#8A2BE2] font-bold">z</span>e & ZK Group.
          </footer>

          <div className="md:hidden fixed bottom-0 w-full bg-[#121212]/95 backdrop-blur-lg border-t border-white/10 z-50">
            <div className="flex justify-around items-center h-14 text-xs font-bold">
              <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Home</button>
              <button onClick={() => setActiveTab('shorts')} className={activeTab === 'shorts' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Shorts</button>
              <button onClick={() => setActiveTab('series')} className={activeTab === 'series' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Series</button>
              <button onClick={() => setActiveTab('account')} className={activeTab === 'account' ? 'text-[#8A2BE2]' : 'text-gray-400'}>Account</button>
            </div>
          </div>

          <DetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />

          <AdminFormModal 
            isOpen={adminModalOpen} 
            onClose={() => setAdminModalOpen(false)} 
            initialData={editingItem}
            onSaved={fetchCatalog}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
