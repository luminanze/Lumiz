<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumiz — Studio Gallery</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

    @keyframes zoomInModal {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-zoom-in-modal { animation: zoomInModal 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#050505] text-gray-900 dark:text-white">
  
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { 
      Home, Play, Plus, User, Smartphone, Info, Sun, Moon, 
      Search, ChevronRight, ChevronLeft, Maximize2, Film, X,
      Edit3, Trash2, LogOut, ShieldCheck
    } from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';

    // =================================================================
    // 1. KONFIGURASI SUPABASE & DAFTAR EMAIL ADMIN
    // =================================================================
    const SUPABASE_URL = 'https://wjxgwnekpskwgsscjptt.supabase.co';
    const SUPABASE_PUBLIC_KEY = 'sb_publishable_783OBGYwk2zKrIDskGAKfg_lAscLdhU';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);

    // MASUKKAN EMAIL GOOGLE ADMIN DI SINI (Huruf kecil semua):
    const ADMIN_EMAILS = [
      'luminanze.team@gmail.com',
      'emailkamu@gmail.com' // <-- Ganti/tambah dengan email Google yang kamu pakai login!
    ];

    // =================================================================
    // 2. HELPER PINTAR: KONVERSI LINK GOOGLE DRIVE, YOUTUBE, & MP4
    // =================================================================
    const getYouTubeId = (url) => {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      return match ? match[1] : null;
    };

    const getDriveFileId = (url) => {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    };

    // Menentukan apakah URL berupa Embed (YouTube / Google Drive) atau Direct Video MP4
    const resolveMediaSource = (itemOrUrl) => {
      const rawUrl = typeof itemOrUrl === 'string' 
        ? itemOrUrl 
        : (itemOrUrl?.video_url || itemOrUrl?.videoUrl || itemOrUrl?.embedUrl || '');

      if (!rawUrl) return { type: 'none', url: '' };

      const ytId = getYouTubeId(rawUrl);
      if (ytId) {
        return { type: 'youtube', url: `https://www.youtube.com/embed/${ytId}?enablejsapi=1` };
      }

      const driveId = getDriveFileId(rawUrl);
      if (driveId) {
        return { 
          type: 'drive', 
          embedUrl: `https://drive.google.com/file/d/${driveId}/preview`,
          directUrl: `https://drive.google.com/uc?export=download&id=${driveId}`
        };
      }

      return { type: 'mp4', url: rawUrl };
    };

    // =================================================================
    // 3. DATA AWAL / POLOSAN (Tampil jika Database Supabase masih kosong)
    // =================================================================
    const DEFAULT_CATEGORIES = ["All", "Kategori 1", "Kategori 2", "Kategori 3"];
    const YOUTUBE_EMBED_URL = "https://www.youtube.com/embed/sG9m4Twc-ko?si=LDZ3AKqac91nPynB";
    const YOUTUBE_VIDEO_ID = "sG9m4Twc-ko";

    const HERO_CONTENT = {
      title: "Judul Konten Utama",
      description: "Deskripsi singkat konten utama. Silakan ganti teks ini dengan sinopsis atau informasi proyek Anda."
    };

    const DEFAULT_CHAPTERS = [
      { id: 1, title: 'Chapter 1', duration: '00:00', desc: 'Deskripsi chapter 1.', url: '' },
      { id: 2, title: 'Chapter 2', duration: '00:00', desc: 'Deskripsi chapter 2.', url: '' },
      { id: 3, title: 'Chapter 3', duration: '00:00', desc: 'Deskripsi chapter 3.', url: '' }
    ];

    const INITIAL_GALLERY_DATA = [
      { id: 'v1', type: 'short', category: 'Kategori 1', title: 'Judul Short 1', description: 'Deskripsi konten short 1.', img: '', video_url: '', chapters: DEFAULT_CHAPTERS },
      { id: 'v2', type: 'short', category: 'Kategori 2', title: 'Judul Short 2', description: 'Deskripsi konten short 2.', img: '', video_url: '', chapters: DEFAULT_CHAPTERS },
      { id: 'v3', type: 'short', category: 'Kategori 3', title: 'Judul Short 3', description: 'Deskripsi konten short 3.', img: '', video_url: '', chapters: DEFAULT_CHAPTERS },
      { id: 'v4', type: 'short', category: 'Kategori 1', title: 'Judul Short 4', description: 'Deskripsi konten short 4.', img: '', video_url: '', chapters: DEFAULT_CHAPTERS },
      { id: 'h1', type: 'series', category: 'Kategori 1', title: 'Judul Landscape 1', description: 'Deskripsi konten landscape 1.', img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`, video_url: YOUTUBE_EMBED_URL, chapters: DEFAULT_CHAPTERS },
      { id: 'h2', type: 'series', category: 'Kategori 2', title: 'Judul Landscape 2', description: 'Deskripsi konten landscape 2.', img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`, video_url: YOUTUBE_EMBED_URL, chapters: DEFAULT_CHAPTERS },
      { id: 'h3', type: 'series', category: 'Kategori 3', title: 'Judul Landscape 3', description: 'Deskripsi konten landscape 3.', img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`, video_url: YOUTUBE_EMBED_URL, chapters: DEFAULT_CHAPTERS },
      { id: 'h4', type: 'series', category: 'Kategori 1', title: 'Judul Landscape 4', description: 'Deskripsi konten landscape 4.', img: `https://img.youtube.com/vi/${YOUTUBE_VIDEO_ID}/hqdefault.jpg`, video_url: YOUTUBE_EMBED_URL, chapters: DEFAULT_CHAPTERS }
    ];

    // =================================================================
    // 4. MODAL DETAIL (SINOPSIS, CHAPTER & PLAYER DRIVE/YOUTUBE/MP4)
    // =================================================================
    const DetailModal = ({ item, onClose, onOpenFullscreenShort }) => {
      const [isPlayingTrailer, setIsPlayingTrailer] = useState(false);
      const [customPlayUrl, setCustomPlayUrl] = useState(null);

      useEffect(() => {
        setIsPlayingTrailer(false);
        setCustomPlayUrl(null);
      }, [item]);

      if (!item) return null;

      const chapters = item.chapters || [];
      const activeSource = resolveMediaSource(customPlayUrl || item);

      const handlePlayChapter = (chapUrl) => {
        if (chapUrl) setCustomPlayUrl(chapUrl);
        setIsPlayingTrailer(true);
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-12">
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
          
          <div className="relative w-full max-w-4xl max-h-[90vh] bg-white dark:bg-[#121212] rounded-2xl overflow-hidden shadow-2xl animate-zoom-in-modal flex flex-col border border-gray-200 dark:border-gray-800">
            
            <button onClick={onClose} className="absolute top-4 right-4 z-30 p-2 bg-black/60 hover:bg-black/90 text-white rounded-full backdrop-blur-md transition-all hover:scale-110">
              <Plus size={24} className="rotate-45" />
            </button>

            {/* Header Modal: Render Iframe YouTube / Google Drive / MP4 */}
            <div className="relative w-full aspect-video max-h-96 shrink-0 bg-neutral-900">
              {isPlayingTrailer ? (
                <div className="relative w-full h-full">
                  {activeSource.type === 'youtube' ? (
                    <iframe
                      className="w-full h-full"
                      src={`${activeSource.url}&autoplay=1`}
                      title="YouTube video player"
                      frameBorder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                      allowFullScreen
                    ></iframe>
                  ) : activeSource.type === 'drive' ? (
                    <iframe
                      className="w-full h-full"
                      src={activeSource.embedUrl}
                      title="Google Drive video player"
                      frameBorder="0"
                      allow="autoplay; fullscreen"
                      allowFullScreen
                    ></iframe>
                  ) : activeSource.type === 'mp4' ? (
                    <video src={activeSource.url} controls autoPlay className="w-full h-full object-contain bg-black" />
                  ) : (
                    <div className="w-full h-full flex items-center justify-center text-gray-400 text-sm">
                      Belum ada link video yang dimasukkan
                    </div>
                  )}
                  <button
                    onClick={() => setIsPlayingTrailer(false)}
                    className="absolute top-4 left-4 z-30 px-3 py-1.5 bg-black/60 hover:bg-black/80 text-white text-xs font-semibold rounded-md backdrop-blur-md transition-colors"
                  >
                    Tutup Player
                  </button>
                </div>
              ) : (
                <>
                  {item.img ? (
                    <img src={item.img} alt={item.title} className="w-full h-full object-cover opacity-80" />
                  ) : (
                    <div className="w-full h-full bg-gradient-to-br from-neutral-800 to-neutral-950 flex items-center justify-center">
                      <span className="text-neutral-600 font-bold text-sm uppercase tracking-widest">Thumbnail Polosan</span>
                    </div>
                  )}
                  <div className="absolute inset-0 bg-gradient-to-t from-white via-black/20 dark:from-[#121212] to-transparent"></div>
                  
                  <div className="absolute bottom-4 left-6 md:left-10 right-6 z-10">
                    <span className="inline-block px-2.5 py-1 mb-2 text-xs font-bold uppercase tracking-wider bg-violet-600 text-white rounded">
                      {item.category}
                    </span>
                    <h2 className="text-2xl md:text-4xl font-bold text-gray-900 dark:text-white drop-shadow-lg mb-4">
                      {item.title}
                    </h2>
                    <div className="flex flex-wrap items-center gap-3 md:gap-4">
                      <button 
                        onClick={() => { setCustomPlayUrl(null); setIsPlayingTrailer(true); }}
                        className="flex items-center gap-2 bg-white text-black px-6 py-2 md:py-2.5 rounded-md font-bold hover:bg-gray-200 transition-colors shadow-lg"
                      >
                        <Play size={18} fill="currentColor" /> Play Video
                      </button>

                      {item.type === 'short' && onOpenFullscreenShort && (
                        <button 
                          onClick={() => {
                            onClose();
                            onOpenFullscreenShort(item);
                          }}
                          className="flex items-center gap-2 bg-violet-600 hover:bg-violet-700 text-white px-5 py-2 md:py-2.5 rounded-md font-bold transition-colors shadow-lg"
                        >
                          <Maximize2 size={18} /> Fullscreen (9:16)
                        </button>
                      )}
                    </div>
                  </div>
                </>
              )}
            </div>

            <div className="p-6 md:p-10 overflow-y-auto scrollbar-hide">
              <div className="flex flex-wrap items-center gap-4 text-sm font-semibold text-gray-600 dark:text-gray-400 mb-4">
                <span>2026</span>
                <span>{chapters.length} Chapters</span>
                <span className="text-violet-600 dark:text-violet-400">{item.category}</span>
              </div>
              
              <p className="text-gray-700 dark:text-gray-300 mb-8 max-w-3xl leading-relaxed">
                {item.description}
              </p>

              <h3 className="text-xl font-bold mb-4 text-gray-900 dark:text-white flex items-center justify-between">
                <span>Chapters</span>
                <span className="text-sm font-normal text-gray-500">Daftar Episode</span>
              </h3>
              
              <div className="flex flex-col gap-2">
                {chapters.map((chap, index) => (
                  <div 
                    key={chap.id || index} 
                    onClick={() => handlePlayChapter(chap.url)}
                    className="flex items-center justify-between p-4 rounded-xl border border-gray-100 dark:border-[#222] hover:border-violet-500/50 hover:bg-gray-50 dark:hover:bg-[#1a1a1a] transition-all cursor-pointer group"
                  >
                    <div className="flex items-center gap-4 md:gap-6">
                      <span className="text-xl md:text-2xl font-bold text-gray-400 dark:text-gray-600 group-hover:text-violet-500 transition-colors w-6 text-center">
                        {index + 1}
                      </span>
                      <div>
                        <h4 className="font-semibold text-gray-900 dark:text-white group-hover:text-violet-500 transition-colors mb-0.5">
                          {chap.title}
                        </h4>
                        <p className="text-xs text-gray-500">{chap.desc}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-4">
                      <span className="text-xs font-medium text-gray-400 hidden md:block">{chap.duration}</span>
                      <button className="p-2.5 rounded-full bg-gray-100 dark:bg-[#2a2a2a] text-gray-900 dark:text-white group-hover:bg-violet-600 group-hover:text-white transition-all">
                        <Play size={14} fill="currentColor" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // =================================================================
    // 5. MODAL FORM INPUT & EDIT VIDEO (KHUSUS ADMIN)
    // =================================================================
    const AdminFormModal = ({ isOpen, onClose, initialData, onSaved }) => {
      const [formData, setFormData] = useState({
        type: 'short',
        category: 'Kategori 1',
        title: '',
        description: '',
        img: '',
        video_url: '',
        chapters: [{ id: 1, title: 'Chapter 1', duration: '05:00', desc: 'Episode 1', url: '' }]
      });
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (initialData) {
          setFormData({
            type: initialData.type || 'short',
            category: initialData.category || 'Kategori 1',
            title: initialData.title || '',
            description: initialData.description || '',
            img: initialData.img || '',
            video_url: initialData.video_url || initialData.videoUrl || initialData.embedUrl || '',
            chapters: initialData.chapters?.length ? initialData.chapters : [{ id: 1, title: 'Chapter 1', duration: '05:00', desc: '', url: '' }]
          });
        } else {
          setFormData({
            type: 'short',
            category: 'Kategori 1',
            title: '',
            description: '',
            img: '',
            video_url: '',
            chapters: [{ id: 1, title: 'Chapter 1', duration: '05:00', desc: 'Deskripsi chapter 1', url: '' }]
          });
        }
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      // Otomatis ambil thumbnail jika link video adalah YouTube dan kolom img masih kosong
      const handleVideoUrlChange = (url) => {
        const ytId = getYouTubeId(url);
        let newImg = formData.img;
        if (ytId && !formData.img) {
          newImg = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
        }
        setFormData({ ...formData, video_url: url, img: newImg });
      };

      const addChapter = () => {
        const nextId = formData.chapters.length + 1;
        setFormData({
          ...formData,
          chapters: [...formData.chapters, { id: nextId, title: `Chapter ${nextId}`, duration: '05:00', desc: `Deskripsi chapter ${nextId}`, url: '' }]
        });
      };

      const updateChapter = (idx, field, val) => {
        const updated = [...formData.chapters];
        updated[idx][field] = val;
        setFormData({ ...formData, chapters: updated });
      };

      const removeChapter = (idx) => {
        setFormData({ ...formData, chapters: formData.chapters.filter((_, i) => i !== idx) });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);

        const payload = {
          type: formData.type,
          category: formData.category,
          title: formData.title,
          description: formData.description,
          img: formData.img,
          video_url: formData.video_url,
          chapters: formData.chapters
        };

        let error;
        // Jika edit data yang sudah ada di Supabase (id berupa angka)
        if (initialData && typeof initialData.id === 'number') {
          ({ error } = await supabase.from('lumiz_catalog').update(payload).eq('id', initialData.id));
        } else {
          ({ error } = await supabase.from('lumiz_catalog').insert([payload]));
        }

        setSaving(false);
        if (error) {
          alert('Gagal menyimpan ke Supabase: ' + error.message + '\n\nPastikan tabel lumiz_catalog sudah dibuat dan email kamu terdaftar di Policy SQL.');
        } else {
          onSaved();
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
          <div className="bg-white dark:bg-[#141414] border border-gray-200 dark:border-violet-500/30 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div className="flex justify-between items-center mb-5 pb-3 border-b border-gray-200 dark:border-gray-800">
              <h3 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white">
                {initialData && typeof initialData.id === 'number' ? '✏️ Edit Konten Lumiz' : '+ Upload Konten Baru ke Database'}
              </h3>
              <button onClick={onClose} className="p-1.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800">
                <X size={20} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs md:text-sm">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold mb-1 text-gray-600 dark:text-gray-300">Format Tayangan</label>
                  <select 
                    value={formData.type} 
                    onChange={e => setFormData({...formData, type: e.target.value})}
                    className="w-full p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800"
                  >
                    <option value="short">Shorts (Vertikal 9:16)</option>
                    <option value="series">Series (Landscape 16:9)</option>
                  </select>
                </div>
                <div>
                  <label className="block font-semibold mb-1 text-gray-600 dark:text-gray-300">Kategori (Ketik bebas / pilih)</label>
                  <input 
                    required
                    type="text"
                    list="category-options"
                    value={formData.category}
                    onChange={e => setFormData({...formData, category: e.target.value})}
                    placeholder="Contoh: Kategori 1 / Sci-Fi / Origin"
                    className="w-full p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800"
                  />
                  <datalist id="category-options">
                    <option value="Kategori 1" />
                    <option value="Kategori 2" />
                    <option value="Kategori 3" />
                    <option value="Origin" />
                    <option value="Sci-Fi" />
                    <option value="Cyberpunk" />
                  </datalist>
                </div>
              </div>

              <div>
                <label className="block font-semibold mb-1 text-gray-600 dark:text-gray-300">Judul Tayangan</label>
                <input 
                  required
                  type="text"
                  value={formData.title}
                  onChange={e => setFormData({...formData, title: e.target.value})}
                  placeholder="Masukkan judul video..."
                  className="w-full p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800"
                />
              </div>

              <div>
                <label className="block font-semibold mb-1 text-gray-600 dark:text-gray-300">Sinopsis / Deskripsi</label>
                <textarea 
                  required
                  rows="3"
                  value={formData.description}
                  onChange={e => setFormData({...formData, description: e.target.value})}
                  placeholder="Masukkan sinopsis cerita..."
                  className="w-full p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800"
                ></textarea>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold mb-1 text-gray-600 dark:text-gray-300">Link Video Trailer / Utama (Drive / YouTube / MP4)</label>
                  <input 
                    type="text"
                    value={formData.video_url}
                    onChange={e => handleVideoUrlChange(e.target.value)}
                    placeholder="https://drive.google.com/... atau YouTube"
                    className="w-full p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800"
                  />
                </div>
                <div>
                  <label className="block font-semibold mb-1 text-gray-600 dark:text-gray-300">Link Gambar Thumbnail / Poster</label>
                  <input 
                    type="text"
                    value={formData.img}
                    onChange={e => setFormData({...formData, img: e.target.value})}
                    placeholder="https://... (Otomatis jika pakai link YouTube)"
                    className="w-full p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800"
                  />
                </div>
              </div>

              {/* Pengaturan Chapters */}
              <div className="pt-3 border-t border-gray-200 dark:border-gray-800">
                <div className="flex justify-between items-center mb-2">
                  <label className="font-bold text-gray-700 dark:text-gray-200">Daftar Chapter / Episode</label>
                  <button type="button" onClick={addChapter} className="px-3 py-1 rounded bg-violet-600/20 text-violet-500 font-bold text-xs hover:bg-violet-600 hover:text-white transition">
                    + Tambah Chapter
                  </button>
                </div>

                <div className="space-y-2 max-h-44 overflow-y-auto pr-1">
                  {formData.chapters.map((chap, idx) => (
                    <div key={idx} className="p-2.5 rounded-lg bg-gray-100 dark:bg-[#0a0a0a] border border-gray-300 dark:border-gray-800 space-y-2">
                      <div className="flex gap-2 items-center">
                        <input type="text" value={chap.title} onChange={e => updateChapter(idx, 'title', e.target.value)} placeholder="Judul Chapter" className="w-1/2 p-1.5 rounded bg-white dark:bg-[#141414] border border-gray-300 dark:border-gray-700 text-xs" />
                        <input type="text" value={chap.duration} onChange={e => updateChapter(idx, 'duration', e.target.value)} placeholder="Durasi (12:00)" className="w-1/4 p-1.5 rounded bg-white dark:bg-[#141414] border border-gray-300 dark:border-gray-700 text-xs" />

    const ThemeContext = React.createContext();

    const ThemeProvider = ({ children }) => {
      const [isDark, setIsDark] = useState(true);

      useEffect(() => {
        const root = window.document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
      }, [isDark]);

      const toggleTheme = () => setIsDark(!isDark);

      return (
        <ThemeContext.Provider value={{ isDark, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    };

    const useTheme = () => React.useContext(ThemeContext);

    // =================================================================
    // 7. KARTU VIDEO (HOVER PREVIEW + TOMBOL EDIT & HAPUS KHUSUS ADMIN)
    // =================================================================
    const HoverVideoCard = ({ item, isVertical, onClick, isAdmin, onEdit, onDelete }) => {
      const [isHovered, setIsHovered] = useState(false);
      const videoRef = useRef(null);
      const media = resolveMediaSource(item);

      useEffect(() => {
        let playPromise;
        if (isHovered && videoRef.current && (media.type === 'mp4' || media.type === 'drive')) {
          videoRef.current.currentTime = 0;
          playPromise = videoRef.current.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {});
          }
        } else if (!isHovered && videoRef.current) {
          videoRef.current.pause();
        }
      }, [isHovered, media.type]);

      return (
        <div
          className={`relative cursor-pointer overflow-hidden rounded-lg bg-gray-200 dark:bg-[#141414] border border-gray-300/60 dark:border-gray-800 group shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 ${
            isVertical ? 'aspect-[9/16]' : 'aspect-video'
          }`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          onClick={() => onClick(item)}
        >
          {/* Layer 1: Preview Video Saat Hover (YouTube / Drive / MP4) */}
          {media.type === 'youtube' && isHovered ? (
            <iframe
              className="absolute inset-0 w-full h-full z-0 pointer-events-none"
              src={`${media.url}&autoplay=1&mute=1&controls=0&modestbranding=1`}
              title={item.title}
              frameBorder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            ></iframe>
          ) : (media.type === 'mp4' || media.type === 'drive') ? (
            <video
              ref={videoRef}
              src={media.type === 'drive' ? media.directUrl : media.url}
              muted
              loop
              playsInline
              className="absolute inset-0 w-full h-full object-cover z-0"
            />
          ) : null}

          {/* Layer 2: Poster atau Polosan */}
          {item.img ? (
            <img
              src={item.img}
              alt={item.title}
              className={`absolute inset-0 w-full h-full object-cover z-10 transition-opacity duration-500 ease-in-out ${
                isHovered && media.type !== 'none' ? 'opacity-0' : 'opacity-100'
              }`}
            />
          ) : (
            <div className="absolute inset-0 w-full h-full bg-gradient-to-b from-gray-200 to-gray-300 dark:from-[#1a1a1a] dark:to-[#111111] z-10 flex items-center justify-center">
              <span className="text-xs font-semibold text-gray-400 dark:text-gray-600 uppercase tracking-widest">
                {isVertical ? '9:16 Polosan' : '16:9 Polosan'}
              </span>
            </div>
          )}

          {/* Badge Kategori */}
          <div className="absolute top-2 left-2 md:top-3 md:left-3 z-20">
            <span className="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-black/60 text-white rounded backdrop-blur-sm border border-white/10">
              {item.category}
            </span>
          </div>

          {/* Tombol Edit & Hapus Khusus Admin (Pojok Kanan Atas) */}
          {isAdmin && (
            <div className="absolute top-2 right-2 md:top-3 md:right-3 z-40 flex gap-1.5" onClick={e => e.stopPropagation()}>
              <button 
                onClick={() => onEdit(item)}
                className="p-1.5 rounded-md bg-black/75 hover:bg-violet-600 text-white backdrop-blur-sm border border-white/15 transition"
                title="Edit Konten"
              >
                <Edit3 size={14} />
              </button>
              {typeof item.id === 'number' && (
                <button 
                  onClick={() => onDelete(item.id)}

                  <Trash2 size={14} />
                </button>
              )}
            </div>
          )}

          {/* Ikon Play Center */}
          <div className={`absolute inset-0 z-20 flex items-center justify-center transition-opacity duration-300 ${isHovered ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-10 h-10 md:w-12 md:h-12 bg-black/40 rounded-md flex items-center justify-center backdrop-blur-sm border border-white/20">
              <Play size={20} className="text-white ml-1 opacity-80" fill="currentColor" />
            </div>
          </div>

          {/* Info Saat Hover */}
          <div className={`absolute inset-0 z-30 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-4 md:p-5 transition-opacity duration-300 ${isHovered ? 'opacity-100' : 'opacity-0'}`}>

                <span className="text-[10px] font-medium text-violet-300">{item.chapters?.length || 0} Chapters</span>
              </div>
            </div>
          </div>
        </div>
      );

                    <h3 className="text-white font-bold text-lg mb-1 drop-shadow-md">{short.title}</h3>
                    <p className="text-gray-300 text-xs drop-shadow-md">{short.description}</p>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const Footer = () => (
      <footer className="w-full py-8 px-6 border-t border-gray-200 dark:border-gray-800/80 bg-white dark:bg-[#050505] text-center">
        <p className="text-xs md:text-sm text-gray-500 dark:text-gray-400 font-medium tracking-wide">
          <span className="font-bold text-gray-900 dark:text-white">
            Lumi<span className="text-violet-500" style={{ color: '#8A2BE2' }}>z</span>
          </span>{' '}
          — Produced by Lumiztudio | Supervised by Nezen | Part of Luminanze &amp; ZK Group
        </p>
      </footer>
    );

    const BottomNav = ({ activeTab, setActiveTab }) => {
      return (
        <div className="md:hidden fixed bottom-0 w-full bg-white/90 dark:bg-[#121212]/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 z-50 pb-safe">
          <div className="flex justify-around items-center h-16">
            <button 
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'home' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <Home size={22} />
              <span className="text-[10px] font-medium mt-1">Home</span>
            </button>
            <button 
              onClick={() => setActiveTab('shorts')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'shorts' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <Smartphone size={22} />
              <span className="text-[10px] font-medium mt-1">Shorts</span>
            </button>
            <button 
              onClick={() => setActiveTab('series')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'series' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <Film size={22} />
              <span className="text-[10px] font-medium mt-1">Series</span>
            </button>
            <button 
              onClick={() => setActiveTab('account')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'account' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              <User size={22} />
              <span className="text-[10px] font-medium mt-1">Account</span>
            </button>
          </div>
        </div>
      );
    };

    // =================================================================
    // 9. MAIN APP (INTEGRASI SUPABASE DATABASE & GOOGLE LOGIN)
    // =================================================================
    const MainApp = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [catalogItems, setCatalogItems] = useState(INITIAL_GALLERY_DATA);
      const [selectedItem, setSelectedItem] = useState(null);
      const [fullscreenShort, setFullscreenShort] = useState(null);

      // State Auth & Admin
      const [user, setUser] = useState(null);
      const [adminModalOpen, setAdminModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const isAdmin = Boolean(user && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.email?.toLowerCase()));

      // Ambil data dari Supabase
      const fetchSupabaseCatalog = async () => {
        const { data, error } = await supabase
          .from('lumiz_catalog')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data && data.length > 0) {
          setCatalogItems(data);
        } else if (!error && data && data.length === 0) {
          setCatalogItems(INITIAL_GALLERY_DATA);
        }
      };

      useEffect(() => {
        fetchSupabaseCatalog();

        // Cek sesi login Google
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const handleGoogleLogin = async () => {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.href }
        });
        if (error) alert('Gagal membuka Login Google: ' + error.message);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
      };

      const handleDeleteItem = async (id) => {
        if (!window.confirm('Yakin ingin menghapus konten ini dari database Lumiz?')) return;
        const { error } = await supabase.from('lumiz_catalog').delete().eq('id', id);
        if (error) {
          alert('Gagal menghapus: ' + error.message);
        } else {
          fetchSupabaseCatalog();
        }
      };

      const shortsList = catalogItems.filter(i => i.type === 'short');
      const seriesList = catalogItems.filter(i => i.type === 'series');

      // Gabungkan kategori bawaan dengan kategori baru dari Supabase
      const dynamicCategories = Array.from(new Set([
        ...DEFAULT_CATEGORIES,
        ...catalogItems.map(i => i.category).filter(Boolean)
      ]));

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 dark:bg-[#050505] text-gray-900 dark:text-white font-sans selection:bg-violet-500/30">
          <Header 
            activeTab={activeTab} 
            setActiveTab={setActiveTab} 
            isAdmin={isAdmin}
            user={user}
            onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
          />

          <main className="flex-grow pb-20 md:pb-8">
            {activeTab === 'home' && (
              <div className="animate-fade-in">
                <HeroBanner />
                <StudioGallery 
                  shorts={shortsList}
                  series={seriesList}
                  categories={dynamicCategories}
                  onItemClick={(item) => setSelectedItem(item)}
                  isAdmin={isAdmin}
                  onAddClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                  onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                  onDeleteClick={handleDeleteItem}
                />
              </div>
            )}

            {activeTab === 'shorts' && (
              <ShortsCatalogPage 
                shorts={shortsList}
                categories={dynamicCategories}
                onItemClick={(item) => setSelectedItem(item)} 
                onOpenFullscreen={(shortItem) => setFullscreenShort(shortItem)}
                isAdmin={isAdmin}
                onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                onDeleteClick={handleDeleteItem}
              />
            )}

            {activeTab === 'series' && (
              <SeriesCatalogPage 
                series={seriesList}
                categories={dynamicCategories}
                onItemClick={(item) => setSelectedItem(item)} 
                isAdmin={isAdmin}
                onEditClick={(item) => { setEditingItem(item); setAdminModalOpen(true); }}
                onDeleteClick={handleDeleteItem}
              />
            )}

            {activeTab === 'account' && (
              <div className="pt-28 px-6 md:px-12 flex flex-col items-center justify-center min-h-[75vh] animate-fade-in">
                <div className="w-full max-w-md bg-white dark:bg-[#121212] border border-gray-200 dark:border-gray-800 rounded-2xl p-8 text-center shadow-xl">
                  {user ? (
                    <>
                      <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-violet-600 to-fuchsia-500 mx-auto mb-4 overflow-hidden flex items-center justify-center text-white font-bold text-2xl">
                        {user.user_metadata?.avatar_url ? (
                          <img src={user.user_metadata.avatar_url} alt="Profile" className="w-full h-full object-cover" />
                        ) : (
                          user.email?.[0]?.toUpperCase()
                        )}
                      </div>
                      <h2 className="text-xl font-bold mb-1">{user.user_metadata?.full_name || 'User Lumiz'}</h2>
                      <p className="text-xs text-gray-500 dark:text-gray-400 mb-5">{user.email}</p>

                      {isAdmin ? (
                        <div className="mb-6 p-3 rounded-xl bg-violet-600/15 border border-violet-500/30 text-violet-500 dark:text-violet-300 text-xs font-semibold flex items-center justify-center gap-2">
                          <ShieldCheck size={16} /> Mode Admin Aktif (Bisa Tambah, Edit & Hapus)
                        </div>
                      ) : (
                        <div className="mb-6 p-3 rounded-xl bg-gray-100 dark:bg-gray-800/60 text-gray-500 text-xs">
                          Status: Akun Penonton Reguler
                        </div>
                      )}

                      <div className="flex flex-col gap-3">
                        {isAdmin && (
                          <button 
                            onClick={() => { setEditingItem(null); setAdminModalOpen(true); }}
                            className="w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-bold text-sm transition shadow-lg"
                          >
                            + Upload Video Baru
                          </button>
                        )}
                        <button 
                          onClick={handleLogout}
                          className="w-full py-2.5 rounded-xl border border-red-500/40 text-red-500 hover:bg-red-500/10 font-semibold text-sm transition flex items-center justify-center gap-2"
                        >
                          <LogOut size={16} /> Keluar (Sign Out)
                        </button>
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="w-20 h-20 rounded-full bg-neutral-800 mx-auto mb-5 flex items-center justify-center text-violet-500">
                        <User size={36} />
                      </div>
                      <h2 className="text-2xl font-bold mb-2">
                        Masuk ke Lumi<span className="text-violet-500" style={{ color: '#8A2BE2' }}>z</span>
                      </h2>
                      <p className="text-xs text-gray-500 dark:text-gray-400 mb-6 leading-relaxed">
                        Login menggunakan akun Google Anda. Jika email terdaftar sebagai Admin Lumiztudio, tombol kelola video akan otomatis muncul.
                      </p>
                      <button 
                        onClick={handleGoogleLogin}
                        className="w-full py-3 px-6 rounded-xl bg-gray-900 dark:bg-white text-white dark:text-black font-bold text-sm hover:opacity-90 transition flex items-center justify-center gap-3 shadow-lg"
                      >
                        <svg className="w-4 h-4" viewBox="0 0 24 24">
                          <path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27c3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10c5.35 0 9.25-3.67 9.25-9.09c0-1.15-.15-1.81-.15-1.81Z" />
                        </svg>
                        Login dengan Google
                      </button>
                    </>
                  )}
                </div>
              </div>
            )}
          </main>

          <Footer />
          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />

          {fullscreenShort && (
            <ShortsView 
              shorts={shortsList}
              initialShort={fullscreenShort} 
              onClose={() => setFullscreenShort(null)}
              onSelectInfo={(item) => setSelectedItem(item)}
            />
          )}

          <DetailModal 
            item={selectedItem} 
            onClose={() => setSelectedItem(null)} 
            onOpenFullscreenShort={(shortItem) => setFullscreenShort(shortItem)}
          />

          <AdminFormModal 
            isOpen={adminModalOpen}
            onClose={() => setAdminModalOpen(false)}
            initialData={editingItem}
            onSaved={fetchSupabaseCatalog}
          />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(
      <ThemeProvider>
        <MainApp />
      </ThemeProvider>
    );
  </script>
</body>
</html>
