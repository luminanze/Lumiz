    const ThemeContext = React.createContext();

    const ThemeProvider = ({ children }) => {
      const [isDark, setIsDark] = useState(true);

      useEffect(() => {
        const root = window.document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
      }, [isDark]);

      const toggleTheme = () => setIsDark(!isDark);

      return (
        <ThemeContext.Provider value={{ isDark, toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    };

            ></div>
          </div>
        </header>
      );
    };

    const HeroBanner = () => {
      return (
        <div className="relative w-full h-[60vh] md:h-[75vh] overflow-hidden bg-gray-900">
          <img 
            src={HERO_CONTENT.imageUrl} 
            alt="Hero Background" 
            className="absolute inset-0 w-full h-full object-cover opacity-60 dark:opacity-50 scale-105 animate-[pulse_10s_ease-in-out_infinite_alternate]"
          />
          <div className="absolute inset-0 bg-gradient-to-r from-white via-white/50 to-transparent dark:from-[#050505] dark:via-[#050505]/50 dark:to-transparent" />
          <div className="absolute inset-0 bg-gradient-to-t from-gray-50 via-transparent to-transparent dark:from-[#050505] dark:via-transparent dark:to-transparent" />

          <div className="absolute bottom-[15%] left-6 md:left-12 max-w-2xl z-10 animate-fade-in-up">
            <h1 className="text-5xl md:text-7xl font-bold text-gray-900 dark:text-white mb-4 drop-shadow-md">
              {HERO_CONTENT.title}
            </h1>
            <p className="text-sm md:text-lg text-gray-700 dark:text-gray-300 mb-8 max-w-md md:max-w-xl drop-shadow-sm font-medium">
              {HERO_CONTENT.description}
            </p>
          </div>
        </div>
      );
    };

    const HoverVideoCard = ({ item, isVertical, onClick }) => {
      const [isHovered, setIsHovered] = useState(false);
      const videoRef = useRef(null);

      useEffect(() => {
        let playPromise;
        if (isHovered && videoRef.current) {
          videoRef.current.currentTime = 0;
          playPromise = videoRef.current.play();
          if (playPromise !== undefined) {
            playPromise.catch(error => {
              console.log("Auto-play dicegah oleh browser", error);
            });
          }
        } else if (!isHovered && videoRef.current) {
          videoRef.current.pause();
        }
      }, [isHovered]);

      return (
        <div
          className={`relative cursor-pointer overflow-hidden rounded-md bg-gray-200 dark:bg-gray-800 group shadow-sm hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 ${
            isVertical ? 'aspect-[9/16]' : 'aspect-video'
          }`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          onClick={() => onClick(item)}
        >
          <video
            ref={videoRef}
            src={item.videoUrl}
            muted
            loop
            playsInline
            className="absolute inset-0 w-full h-full object-cover z-0"
          />

          <img
            src={item.img}
            alt={item.title}
            className={`absolute inset-0 w-full h-full object-cover z-10 transition-opacity duration-700 ease-in-out ${
              isHovered ? 'opacity-0' : 'opacity-100'
            }`}
          />

          <div className="absolute top-2 left-2 md:top-3 md:left-3 z-20">
            <span className="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider bg-black/60 text-white rounded backdrop-blur-sm border border-white/10">
              {item.category}
            </span>
          </div>

          <div className={`absolute inset-0 z-20 flex items-center justify-center transition-opacity duration-300 ${isHovered ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-10 h-10 md:w-12 md:h-12 bg-black/40 rounded-md flex items-center justify-center backdrop-blur-sm border border-white/20 transition-colors">
              <Play size={20} className="text-white ml-1 opacity-70" fill="currentColor" />
            </div>
          </div>

          <div className={`absolute top-2 right-2 md:top-3 md:right-3 z-20 transition-opacity duration-300 ${isHovered ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-6 h-6 md:w-8 md:h-8 bg-black/40 rounded flex items-center justify-center backdrop-blur-sm text-white/70">
              <Maximize2 size={12} className="md:w-4 md:h-4" />
            </div>
          </div>

          <div className={`absolute inset-0 z-30 bg-gradient-to-t from-black/90 via-black/20 to-transparent flex flex-col justify-end p-4 md:p-6 transition-opacity duration-300 ${isHovered ? 'opacity-100' : 'opacity-0'}`}>
            <div className="transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300">
               <h3 className="text-white font-bold text-sm md:text-lg drop-shadow-md mb-1">{item.title}</h3>
               <p className="text-gray-300 text-[10px] md:text-xs line-clamp-2 md:line-clamp-3 mb-3">
                  {item.description}
               </p>
               <div className="flex gap-2 items-center">
                 <span className="text-[10px] font-semibold bg-white text-black px-2 py-1 rounded">Trailer</span>
                 <span className="text-[10px] font-medium text-violet-300">{item.chapters?.length || 0} Chapters</span>
               </div>
            </div>
          </div>
        </div>
      );
    };

    const StudioGallery = ({ onItemClick }) => {
      const [selectedCategory, setSelectedCategory] = useState("All");
      const verticalScrollRef = useRef(null);

      const filteredShorts = selectedCategory === "All" 
        ? GALLERY_DATA.shorts 
        : GALLERY_DATA.shorts.filter(item => item.category === selectedCategory);

      const filteredSeries = selectedCategory === "All" 
        ? GALLERY_DATA.series 
        : GALLERY_DATA.series.filter(item => item.category === selectedCategory);

      const scrollVerticalRow = (direction) => {
        if (verticalScrollRef.current) {
          const scrollAmount = 320;
          verticalScrollRef.current.scrollBy({
            left: direction === 'left' ? -scrollAmount : scrollAmount,
            behavior: 'smooth'
          });
        }
      };

      const specificCategories = CATEGORIES.filter(cat => cat !== "All");

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 py-12 md:py-20 space-y-16">
          
          <div className="text-center space-y-6">
            <div>
              <p className="text-[10px] md:text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-[0.2em] mb-2">Our Output</p>
              <h2 className="text-3xl md:text-5xl font-black text-gray-900 dark:text-white uppercase tracking-tight">Studio Gallery</h2>
              <p className="text-sm md:text-base text-gray-500 dark:text-gray-400 mt-4 max-w-xl mx-auto">
                Jelajahi koleksi konten original kami. Arahkan kursor ke kartu untuk melihat cuplikan eksklusif tanpa suara.
              </p>
            </div>

            <div className="flex flex-wrap justify-center gap-2 md:gap-3 pt-2">
              {CATEGORIES.map((category) => (
                <button
                  key={category}
                  onClick={() => setSelectedCategory(category)}
                  className={`px-5 py-2 rounded-full text-xs md:text-sm font-bold transition-all ${
                    selectedCategory === category
                      ? 'bg-violet-600 text-white shadow-lg shadow-violet-600/30'
                      : 'bg-gray-200 dark:bg-[#161616] text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-[#222]'
                  }`}
                >
                  {category}
                </button>
              ))}
            </div>
          </div>

          <div className="space-y-6">
            <div className="flex items-center justify-between">
              <h3 className="text-sm md:text-lg font-bold text-gray-900 dark:text-white uppercase tracking-wider flex items-center gap-2">
                Vertical Content (9:16)
              </h3>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => scrollVerticalRow('left')}
                  className="p-2 rounded-full bg-gray-200 dark:bg-[#1a1a1a] text-gray-800 dark:text-white hover:bg-violet-600 hover:text-white transition-colors"
                  aria-label="Geser Kiri"
                >
                  <ChevronLeft size={20} />
                </button>
                <button
                  onClick={() => scrollVerticalRow('right')}
                  className="p-2 rounded-full bg-gray-200 dark:bg-[#1a1a1a] text-gray-800 dark:text-white hover:bg-violet-600 hover:text-white transition-colors"
                  aria-label="Geser Kanan"
                >
                  <ChevronRight size={20} />
                </button>
              </div>
            </div>

            <div 
              ref={verticalScrollRef}
              className="flex gap-4 md:gap-6 overflow-x-auto scrollbar-hide snap-x snap-mandatory pb-2"
            >
              {filteredShorts.map((item) => (
                <div key={item.id} className="w-[45%] sm:w-[30%] md:w-[23%] shrink-0 snap-start">
                  <HoverVideoCard item={item} isVertical={true} onClick={onItemClick} />
                </div>
              ))}
            </div>
          </div>

          <div className="space-y-6">
            <h3 className="text-sm md:text-lg font-bold text-gray-900 dark:text-white uppercase tracking-wider flex items-center gap-2">
              Cinematic Landscape (16:9)
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
              {filteredSeries.map((item) => (
                <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} />
              ))}
            </div>
          </div>

          <div className="space-y-12 pt-8 border-t border-gray-200 dark:border-gray-800/80">
            <div>
              <p className="text-[10px] md:text-xs font-bold text-violet-500 uppercase tracking-[0.2em] mb-1">Curated Collections</p>
              <h3 className="text-2xl md:text-3xl font-black text-gray-900 dark:text-white uppercase tracking-tight">
                Explore By Category
              </h3>
            </div>

            {specificCategories.map((cat) => {
              const catShorts = GALLERY_DATA.shorts.filter(item => item.category === cat);
              const catSeries = GALLERY_DATA.series.filter(item => item.category === cat);

              return (
                <div key={cat} className="space-y-6">
                  <div className="flex items-center justify-between border-l-4 border-violet-600 pl-3">
                    <h4 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white">
                      {cat} Universe
                    </h4>
                    <span className="text-xs font-medium text-gray-500">
                      {catShorts.length + catSeries.length} Titles
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    {catSeries.map((item) => (
                      <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} />
                    ))}
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                    {catShorts.map((item) => (
                      <HoverVideoCard key={item.id} item={item} isVertical={true} onClick={onItemClick} />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

        </div>
      );
    };

    const ShortsCatalogPage = ({ onItemClick, onOpenFullscreen }) => {
      const specificCategories = CATEGORIES.filter(cat => cat !== "All");

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 pt-24 pb-16 space-y-12 animate-fade-in">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-gray-200 dark:border-gray-800 pb-6">
            <div>
              <p className="text-xs font-bold text-violet-500 uppercase tracking-[0.2em] mb-2">Vertical Format (9:16)</p>
              <h1 className="text-3xl md:text-5xl font-black text-gray-900 dark:text-white uppercase tracking-tight">
                Shorts Catalog
              </h1>
              <p className="text-sm text-gray-500 dark:text-gray-400 mt-2 max-w-xl">
                Arahkan kursor pada kartu untuk memutar preview tanpa suara, atau klik kartu untuk melihat detail chapter dan memutar dalam mode layar penuh.
              </p>
            </div>
            <button
              onClick={() => onOpenFullscreen(GALLERY_DATA.shorts[0])}
              className="flex items-center gap-2 self-start md:self-auto bg-violet-600 hover:bg-violet-700 text-white px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-lg shadow-violet-600/25"
            >
              <Smartphone size={18} /> Buka Feed Layar Penuh
            </button>
          </div>

          {specificCategories.map((cat) => {
            const items = GALLERY_DATA.shorts.filter(short => short.category === cat);
            if (items.length === 0) return null;

            return (
              <div key={cat} className="space-y-4">
                <h2 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wider flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-violet-500"></span>
                  {cat} Shorts
                </h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
                  {items.map((item) => (
                    <HoverVideoCard key={item.id} item={item} isVertical={true} onClick={onItemClick} />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const SeriesCatalogPage = ({ onItemClick }) => {
      const specificCategories = CATEGORIES.filter(cat => cat !== "All");

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 pt-24 pb-16 space-y-12 animate-fade-in">
          <div className="border-b border-gray-200 dark:border-gray-800 pb-6">
            <p className="text-xs font-bold text-violet-500 uppercase tracking-[0.2em] mb-2">Widescreen Format (16:9)</p>
            <h1 className="text-3xl md:text-5xl font-black text-gray-900 dark:text-white uppercase tracking-tight">
              Original Series
            </h1>
            <p className="text-sm text-gray-500 dark:text-gray-400 mt-2 max-w-xl">
              Koleksi serial sinematik berformat landscape. Arahkan kursor untuk memutar cuplikan trailer dan klik untuk memilih episode/chapter.
            </p>
          </div>

          {specificCategories.map((cat) => {
            const items = GALLERY_DATA.series.filter(ser => ser.category === cat);
            if (items.length === 0) return null;

            return (
              <div key={cat} className="space-y-4">
                <h2 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white uppercase tracking-wider flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-violet-500"></span>
                  {cat} Series
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                  {items.map((item) => (
                    <HoverVideoCard key={item.id} item={item} isVertical={false} onClick={onItemClick} />
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    };

    const ShortsView = ({ initialShort, onClose, onSelectInfo }) => {
      const orderedShorts = initialShort
        ? [initialShort, ...GALLERY_DATA.shorts.filter(s => s.id !== initialShort.id)]
        : GALLERY_DATA.shorts;

      return (
        <div className="fixed inset-0 z-[90] bg-black md:bg-[#050505]/95 flex justify-center items-center backdrop-blur-xl animate-fade-in">
          <button
            onClick={onClose}
            className="absolute top-5 right-5 z-[100] flex items-center gap-2 px-4 py-2 rounded-full bg-white/15 hover:bg-white/25 text-white text-xs font-bold backdrop-blur-md transition-all"
          >
            <X size={18} /> Tutup Player
          </button>

          <div className="absolute top-5 left-6 z-[100] pointer-events-none">
            <div className="text-xl font-bold font-sans tracking-tight text-white drop-shadow-md">
              Lumi<span className="text-violet-500" style={{ color: '#8A2BE2' }}>z</span>
            </div>
          </div>

          <div className="w-full h-[100dvh] md:h-[88vh] md:max-w-[calc(88vh*9/16)] md:rounded-2xl overflow-y-scroll snap-y snap-mandatory scrollbar-hide relative bg-gray-900 md:border md:border-gray-800 shadow-2xl">
            {orderedShorts.map((short) => (
              <div key={short.id} className="h-[100dvh] md:h-full w-full snap-start snap-always relative flex items-center justify-center bg-black overflow-hidden group">
                <video 
                  src={short.videoUrl}
                  poster={short.img}
                  className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity"
                  autoPlay 
                  loop 
                  muted 
                  playsInline
                />
                <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-black/90 pointer-events-none" />
                
                <div className="absolute right-4 bottom-24 flex flex-col gap-6 items-center z-10">
                  <button className="flex flex-col items-center gap-1 group/btn">
                    <div className="p-3 rounded-full bg-white/10 backdrop-blur-md text-white group-hover/btn:bg-violet-600 transition-all">
                      <Plus size={24} />
                    </div>
                  </button>
                  <button 
                    onClick={() => onSelectInfo(short)}
                    className="flex flex-col items-center gap-1 group/btn"
                  >
                    <div className="p-3 rounded-full bg-white/10 backdrop-blur-md text-white group-hover/btn:bg-violet-600 transition-all">
                      <Info size={24} />
                    </div>
                  </button>
                </div>

                <div className="absolute bottom-20 left-4 right-20 z-10">
                  <span className="inline-block px-2 py-0.5 mb-2 text-[10px] font-bold uppercase bg-violet-600 text-white rounded">
                    {short.category}
                  </span>
                  <h3 className="text-white font-bold text-lg md:text-xl mb-1 drop-shadow-lg">{short.title}</h3>
                  <p className="text-gray-300 text-xs line-clamp-2">{short.description}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const Footer = () => (
      <footer className="w-full py-8 px-6 border-t border-gray-200 dark:border-gray-800/80 bg-white dark:bg-[#050505] text-center">
        <p className="text-xs md:text-sm text-gray-500 dark:text-gray-400 font-medium tracking-wide">
          <span className="font-bold text-gray-900 dark:text-white">
            Lumi<span className="text-violet-500" style={{ color: '#8A2BE2' }}>z</span>
          </span>{' '}
          — Produced by Lumiztudio | Supervised by Nezen | Part of Luminanze &amp; ZK Group
        </p>
      </footer>
    );

    const BottomNav = ({ activeTab, setActiveTab }) => {
      return (
        <div className="md:hidden fixed bottom-0 w-full bg-white/90 dark:bg-[#121212]/90 backdrop-blur-lg border-t border-gray-200 dark:border-gray-800 z-50 pb-safe">
          <div className="flex justify-around items-center h-16">
            <button 
              onClick={() => setActiveTab('home')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'home' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              {activeTab === 'home' && <div className="absolute top-0 w-8 h-1 bg-violet-600 rounded-b-md" />}
              <Home size={22} strokeWidth={activeTab === 'home' ? 2.5 : 2} />
              <span className="text-[10px] font-medium mt-1">Home</span>
            </button>

            <button 
              onClick={() => setActiveTab('shorts')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'shorts' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              {activeTab === 'shorts' && <div className="absolute top-0 w-8 h-1 bg-violet-600 rounded-b-md" />}
              <Smartphone size={22} strokeWidth={activeTab === 'shorts' ? 2.5 : 2} />
              <span className="text-[10px] font-medium mt-1">Shorts</span>
            </button>

            <button 
              onClick={() => setActiveTab('series')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'series' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              {activeTab === 'series' && <div className="absolute top-0 w-8 h-1 bg-violet-600 rounded-b-md" />}
              <Film size={22} strokeWidth={activeTab === 'series' ? 2.5 : 2} />
              <span className="text-[10px] font-medium mt-1">Series</span>
            </button>

            <button 
              onClick={() => setActiveTab('account')}
              className={`flex flex-col items-center justify-center w-full h-full relative transition-colors ${activeTab === 'account' ? 'text-violet-600 dark:text-violet-500' : 'text-gray-500 dark:text-gray-400'}`}
            >
              {activeTab === 'account' && <div className="absolute top-0 w-8 h-1 bg-violet-600 rounded-b-md" />}
              <User size={22} strokeWidth={activeTab === 'account' ? 2.5 : 2} />
              <span className="text-[10px] font-medium mt-1">Account</span>
            </button>
          </div>
        </div>
      );
    };

    const MainApp = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedItem, setSelectedItem] = useState(null);
      const [fullscreenShort, setFullscreenShort] = useState(null);

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 dark:bg-[#050505] text-gray-900 dark:text-white font-sans selection:bg-violet-500/30">
          
          <Header activeTab={activeTab} setActiveTab={setActiveTab} />

          <main className="flex-grow pb-20 md:pb-8">
            {activeTab === 'home' && (
              <div className="animate-fade-in">
                <HeroBanner />
                <div className="relative z-20 bg-gray-50 dark:bg-[#050505]">
                  <StudioGallery onItemClick={(item) => setSelectedItem(item)} />
                </div>
              </div>
            )}

            {activeTab === 'shorts' && (
              <ShortsCatalogPage 
                onItemClick={(item) => setSelectedItem(item)} 
                onOpenFullscreen={(shortItem) => setFullscreenShort(shortItem)}
              />
            )}

            {activeTab === 'series' && (
              <SeriesCatalogPage 
                onItemClick={(item) => setSelectedItem(item)} 
              />
            )}

            {activeTab === 'account' && (
              <div className="pt-24 px-6 md:px-12 flex flex-col items-center justify-center h-[75vh] animate-fade-in">
                <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-violet-600 to-fuchsia-500 mb-6 shadow-lg shadow-violet-500/20"></div>
                <h2 className="text-2xl font-bold mb-2">User Profile</h2>
                <button className="border border-gray-300 dark:border-gray-700 px-6 py-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors mt-4">
                  Sign Out
                </button>
              </div>
            )}
          </main>

          <Footer />

          <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />

          {fullscreenShort && (
            <ShortsView 
              initialShort={fullscreenShort} 
              onClose={() => setFullscreenShort(null)}
              onSelectInfo={(item) => setSelectedItem(item)}
            />
          )}

          <DetailModal 
            item={selectedItem} 
            onClose={() => setSelectedItem(null)} 
            onOpenFullscreenShort={(shortItem) => setFullscreenShort(shortItem)}
          />
        </div>
      );
    };

    function App() {
      return (
        <ThemeProvider>
          <MainApp />
        </ThemeProvider>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
