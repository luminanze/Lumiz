<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumiz — Official Streaming Network by Lumiztudio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            lumiz: '#8A2BE2'
          }
        }
      }
    };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .card-vertical { aspect-ratio: 9 / 16; }
    .card-horizontal { aspect-ratio: 16 / 9; }
    
    /* Animasi untuk custom toast modal */
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slideDown { animation: slideDown 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-[#0A0A0A] text-white selection:bg-[#8A2BE2]/40">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 1. KONFIGURASI SUPABASE & EMAIL ADMIN RESMI
    // ==========================================
    const SUPABASE_URL = 'https://wjxgwnekpskwgsscjptt.supabase.co';
    const SUPABASE_PUBLIC_KEY = 'sb_publishable_783OBGYwk2zKrIDskGAKfg_lAscLdhU';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY);

    const ADMIN_EMAILS = [
      'keano.dranantya@gmail.com',
      'luminanze.team@gmail.com'
    ];

    const DEFAULT_GENRES = ['Origin', 'Animation', 'Sci-Fi', 'Action'];

    // ==========================================
    // 2. IKON SVG BAWAAN
    // ==========================================
    const IconPlay = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const IconPlus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconX = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconEdit = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
    const IconTrash = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    const IconSettings = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>;
    const IconRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>;
    const IconArrowUp = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="18 15 12 9 6 15"/></svg>;
    const IconArrowDown = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="6 9 12 15 18 9"/></svg>;
    const IconAlert = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconFullscreen = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>;
    const IconMinimize = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>;

    // ==========================================
    // NOTIFIKASI & KONFIRMASI CUSTOM (PENGGANTI ALERT & CONFIRM BAWAAN BROWSER)
    // ==========================================
    const Toast = ({ message, type, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(() => onClose(), 3000);
        return () => clearTimeout(timer);
      }, [onClose]);
      
      const bg = type === 'error' ? 'bg-red-600' : 'bg-emerald-600';
      return (
        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] animate-slideDown flex items-center justify-center">
          <div className={`${bg} text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 font-semibold text-sm border border-white/20`}>
            <IconAlert /> {message}
          </div>
        </div>
      );
    };

    const ConfirmDialog = ({ message, onConfirm, onCancel }) => (
      <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div className="bg-[#141414] border border-white/10 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
          <div className="w-14 h-14 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
            <IconAlert />
          </div>
          <h3 className="text-lg font-bold text-white mb-2">Konfirmasi</h3>
          <p className="text-sm text-gray-400 mb-6">{message}</p>
          <div className="flex gap-3 justify-center">
            <button onClick={onCancel} className="px-5 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm font-semibold transition">Batal</button>
            <button onClick={onConfirm} className="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-bold shadow-lg transition">Ya, Hapus</button>
          </div>
        </div>
      </div>
    );

    // ==========================================
    // 3. HELPER DETEKSI LINK GOOGLE DRIVE & YOUTUBE
    // ==========================================
    const getDriveFileId = (url) => {
      if (!url) return null;
      if (url.includes('youtube.com') || url.includes('youtu.be')) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    };

    const getYouTubeId = (url) => {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    };

    const getPlayerEmbedUrl = (url) => {
      if (!url) return null;
      const ytId = getYouTubeId(url);
      if (ytId) return `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
      const driveId = getDriveFileId(url);
      if (driveId) return `https://drive.google.com/file/d/${driveId}/preview`;
      return null;
    };

    const getHoverYouTubeEmbedUrl = (url) => {
      const ytId = getYouTubeId(url);
      if (!ytId) return null;
      return `https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&loop=1&playlist=${ytId}&playsinline=1&rel=0&showinfo=0`;
    };

    const getPosterUrl = (url, fallbackYtUrl = '') => {
      if (url) {
        const driveId = getDriveFileId(url);
        if (driveId) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1200`;
        const ytId = getYouTubeId(url);
        if (ytId) return `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
        return url;
      }
      const fallbackYtId = getYouTubeId(fallbackYtUrl);
      if (fallbackYtId) return `https://img.youtube.com/vi/${fallbackYtId}/hqdefault.jpg`;
      return '';
    };

    // ==========================================
    // 4. MODAL KELOLA GENRE (TAMBAH / EDIT / HAPUS GENRE)
    // ==========================================
    const GenreManagerModal = ({ isOpen, onClose, genres, setGenres, onCatalogUpdated, showToast, requestConfirm }) => {
      const [newGenre, setNewGenre] = useState('');
      const [editingIdx, setEditingIdx] = useState(null);
      const [editingValue, setEditingValue] = useState('');
      const [busy, setBusy] = useState(false);

      if (!isOpen) return null;

      const saveGenresToLocal = (updatedList) => {
        setGenres(updatedList);
        localStorage.setItem('lumiz_custom_genres', JSON.stringify(updatedList));
      };

      const handleAddGenre = (e) => {
        e.preventDefault();
        const trimmed = newGenre.trim();
        if (!trimmed) return;
        if (genres.some(g => g.toLowerCase() === trimmed.toLowerCase())) {
          showToast('Genre tersebut sudah ada!', 'error');
          return;
        }
        saveGenresToLocal([...genres, trimmed]);
        setNewGenre('');
        showToast('Genre berhasil ditambahkan.');
      };

      const handleSaveEdit = async (oldName) => {
        const trimmed = editingValue.trim();
        if (!trimmed || trimmed === oldName) {
          setEditingIdx(null);
          return;
        }
        setBusy(true);
        const { error } = await supabase.from('lumiz_catalog').update({ category: trimmed }).eq('category', oldName);
        if (error) {
           showToast('Gagal mengubah nama genre di database.', 'error');
        } else {
           const updated = genres.map(g => (g === oldName ? trimmed : g));
           saveGenresToLocal(updated);
           showToast('Genre berhasil diubah.');
           onCatalogUpdated();
        }
        setEditingIdx(null);
        setBusy(false);
      };

      const handleDeleteGenre = (genreName) => {
        requestConfirm(
          `Apakah Anda yakin ingin menghapus genre "${genreName}" dari daftar filter? Tayangan dengan genre ini mungkin tidak akan muncul di filter.`, 
          () => {
            const updated = genres.filter(g => g !== genreName);
            saveGenresToLocal(updated);
            showToast('Genre berhasil dihapus.');
          }
        );
      };

      return (
        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#141414] border border-[#8A2BE2]/40 rounded-2xl max-w-md w-full p-6 text-white shadow-2xl">
            <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
              <h3 className="text-lg font-bold flex items-center gap-2">
                <IconSettings /> Kelola Genre Lumiz
              </h3>
              <button onClick={onClose} className="p-1.5 hover:bg-white/10 rounded-full"><IconX /></button>
            </div>

            <form onSubmit={handleAddGenre} className="flex gap-2 mb-5">
              <input
                type="text"
                value={newGenre}
                onChange={e => setNewGenre(e.target.value)}
                placeholder="Nama genre baru (cth: Medieval, Comedy)..."
                className="flex-1 bg-[#0A0A0A] border border-white/15 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#8A2BE2]"
              />
              <button type="submit" className="px-4 py-2 bg-[#8A2BE2] hover:bg-violet-700 rounded-lg text-xs font-bold whitespace-nowrap">
                + Tambah
              </button>
            </form>

            <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
              {genres.length === 0 ? (
                <p className="text-xs text-gray-500 text-center py-4">Belum ada genre. Tambahkan di atas.</p>
              ) : (
                genres.map((g, idx) => (
                  <div key={g} className="flex items-center justify-between bg-[#0A0A0A] px-3 py-2.5 rounded-lg border border-white/10">
                    {editingIdx === idx ? (
                      <div className="flex items-center gap-2 flex-1 mr-2">
                        <input
                          type="text"
                          value={editingValue}
                          onChange={e => setEditingValue(e.target.value)}
                          className="flex-1 bg-[#141414] border border-[#8A2BE2] rounded px-2 py-1 text-xs text-white"
                          autoFocus
                        />
                        <button
                          disabled={busy}
                          onClick={() => handleSaveEdit(g)}
                          className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-[11px] font-bold"
                        >
                          Simpan
                        </button>
                      </div>
                    ) : (
                      <span className="text-xs font-semibold text-gray-200">{g}</span>
                    )}

                    {editingIdx !== idx && (
                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => { setEditingIdx(idx); setEditingValue(g); }}
                          className="p-1.5 rounded bg-white/5 hover:bg-[#8A2BE2] text-gray-300 hover:text-white transition"
                          title="Ubah Nama Genre"
                        >
                          <IconEdit />
                        </button>
                        <button
                          onClick={() => handleDeleteGenre(g)}
                          className="p-1.5 rounded bg-white/5 hover:bg-red-600 text-gray-300 hover:text-white transition"
                          title="Hapus Genre"
                        >
                          <IconTrash />
                        </button>
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>

            <div className="mt-5 pt-3 border-t border-white/10 flex justify-end">
              <button onClick={onClose} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold">
                Selesai
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. MODAL DETAIL (PEMUTAR VIDEO DRIVE & YOUTUBE)
    // ==========================================
    const DetailModal = ({ item, onClose }) => {
      const [playingIdx, setPlayingIdx] = useState(null);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [cssFullscreen, setCssFullscreen] = useState(false);
      const videoContainerRef = useRef(null);

      useEffect(() => {
        setPlayingIdx(null);
      }, [item]);

      // Support Deteksi Layar Penuh (Supaya Icon Berubah Otomatis)
      useEffect(() => {
        const handleFullscreenChange = () => {
          setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement));
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        return () => {
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
        };
      }, []);

      // Fungsi untuk mengontrol Fullscreen dengan fallback CSS Theater Mode
      const toggleFullscreen = () => {
        if (cssFullscreen) {
          setCssFullscreen(false);
          return;
        }

        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (videoContainerRef.current) {
              if (videoContainerRef.current.requestFullscreen) {
                // Menangkap error 'Disallowed by permissions policy'
                videoContainerRef.current.requestFullscreen().catch((err) => {
                  console.warn("Native fullscreen blocked by permissions, using CSS fallback.");
                  setCssFullscreen(true);
                });
              } else if (videoContainerRef.current.webkitRequestFullscreen) {
                try {
                  videoContainerRef.current.webkitRequestFullscreen();
                } catch (e) {
                  setCssFullscreen(true);
                }
              } else {
                setCssFullscreen(true);
              }
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        } catch (error) {
          console.warn("Fullscreen API error, using CSS fallback.", error);
          setCssFullscreen(true);
        }
      };

      // Handle Keyboard Navigation (Panah Atas / Bawah untuk pindah episode)
      useEffect(() => {
        if (!item) return;
        const chapters = item.chapters && item.chapters.length > 0 ? item.chapters : [{ id: 1 }];
        
        const handleKeyDown = (e) => {
          if (playingIdx === null) return;
          if (e.key === 'ArrowDown' && playingIdx < chapters.length - 1) {
            e.preventDefault();
            setPlayingIdx(playingIdx + 1);
          } else if (e.key === 'ArrowUp' && playingIdx > 0) {
            e.preventDefault();
            setPlayingIdx(playingIdx - 1);
          }
        };
        
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [playingIdx, item]);

      if (!item) return null;

      const chapters = item.chapters && item.chapters.length > 0 ? item.chapters : [
        { id: 1, title: 'Episode 1', duration: 'Play', drive_url: item.video_url }
      ];

      const currentUrl = playingIdx !== null ? (chapters[playingIdx]?.drive_url || item.video_url) : null;
      const embedUrl = getPlayerEmbedUrl(currentUrl);
      const isShort = item.type === 'short';

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 md:p-10">
          <div className="absolute inset-0 bg-black/85 backdrop-blur-md" onClick={onClose}></div>
          
          <div className={`relative w-full bg-[#121212] border border-white/15 rounded-2xl overflow-hidden shadow-2xl flex 
            ${isShort ? 'flex-col md:flex-row max-w-5xl max-h-[95vh] md:max-h-[85vh]' : 'flex-col max-w-4xl max-h-[92vh]'}
          `}>
            
            <button onClick={onClose} className="absolute top-4 right-4 z-50 p-2 bg-black/70 hover:bg-[#8A2BE2] text-white rounded-full backdrop-blur-md transition-all shadow-lg">
              <IconX />
            </button>

            {/* BAGIAN KIRI (DETAIL) UNTUK SHORTS DI DESKTOP, ATAU BAWAH UNTUK SERIES */}
            <div className={`overflow-y-auto scrollbar-hide flex-1 flex flex-col p-6 md:p-8 
              ${isShort ? 'order-2 md:order-1' : 'order-2'}
            `}>
              
              {/* Info Judul Khusus Shorts di Desktop (Tampil di panel kiri) */}
              {isShort && (
                <div className="hidden md:block mb-6 pb-6 border-b border-white/10">
                  <span className="inline-block text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-[#8A2BE2] text-white mb-3 shadow-lg">
                    {item.category || 'Original'} • Short
                  </span>
                  <h2 className="text-3xl lg:text-4xl font-black text-white drop-shadow-lg mb-5 leading-tight tracking-tight">
                    {item.title}
                  </h2>
                  {playingIdx === null && (
                    <button 
                      onClick={() => setPlayingIdx(0)}
                      className="flex items-center gap-2 bg-[#8A2BE2] hover:bg-violet-600 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg shadow-[#8A2BE2]/30 w-fit transform hover:-translate-y-1"
                    >
                      <IconPlay /> Putar Tayangan
                    </button>
                  )}
                </div>
              )}

              <p className="text-gray-300 mb-8 leading-relaxed text-sm md:text-base">
                {item.description}
              </p>

              <h3 className="text-base md:text-lg font-bold mb-4 text-white flex items-center justify-between border-b border-white/10 pb-3 mt-auto md:mt-0">
                <span>Daftar Episode</span>
                <span className="text-xs font-normal text-gray-400 bg-white/10 px-2.5 py-1 rounded-full">{chapters.length} Bagian</span>
              </h3>
              
              <div className="flex flex-col gap-2.5">
                {chapters.map((chap, idx) => {
                  const isPlayingThis = playingIdx === idx;
                  return (
                    <div 
                      key={idx} 
                      onClick={() => setPlayingIdx(idx)}
                      className={`flex items-center justify-between p-3.5 md:p-4 rounded-xl border transition-all cursor-pointer group ${
                        isPlayingThis
                          ? 'border-[#8A2BE2] bg-[#8A2BE2]/20 shadow-[0_0_15px_rgba(138,43,226,0.15)]'
                          : 'border-transparent hover:border-[#8A2BE2]/40 bg-[#1a1a1a] hover:bg-violet-500/10'
                      }`}
                    >
                      <div className="flex items-center gap-4">
                        <span className={`text-xl font-black w-6 text-center ${isPlayingThis ? 'text-[#8A2BE2]' : 'text-gray-500 group-hover:text-[#8A2BE2]/70'}`}>
                          {idx + 1}
                        </span>
                        <h4 className={`font-semibold text-sm md:text-base transition-colors ${isPlayingThis ? 'text-[#8A2BE2]' : 'text-white group-hover:text-[#8A2BE2]/80'}`}>
                          {chap.title}
                        </h4>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="text-[11px] md:text-xs font-medium text-gray-400">{chap.duration || 'Play'}</span>
                        <div className={`p-2 rounded-full transition-all ${isPlayingThis ? 'bg-[#8A2BE2] text-white' : 'bg-[#8A2BE2]/20 text-[#8A2BE2] group-hover:bg-[#8A2BE2]/80 group-hover:text-white'}`}>
                          <IconPlay />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* BAGIAN KANAN (VIDEO) UNTUK SHORTS DI DESKTOP, ATAU ATAS UNTUK SERIES */}
            <div 
              ref={videoContainerRef}
              className={`bg-black shrink-0 flex items-center justify-center transition-all duration-300
              ${cssFullscreen 
                ? 'fixed inset-0 z-[9999] w-full h-full' 
                : `relative ${isShort 
                  ? 'order-1 md:order-2 w-full md:w-[380px] lg:w-[420px] aspect-[9/16] md:aspect-auto md:h-auto max-h-[55vh] md:max-h-none border-b md:border-b-0 md:border-l border-white/10' 
                  : 'order-1 w-full aspect-video'
                }`
              }`}
            >
              {playingIdx !== null ? (
                <>
                  {embedUrl ? (
                    <iframe
                      src={embedUrl}
                      className="w-full h-full border-0 absolute inset-0 z-10"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                      allowFullScreen
                      title={item.title}
                    />
                  ) : (
                    <video 
                      src={currentUrl} 
                      controls 
                      autoPlay 
                      onEnded={() => {
                        // Fitur Auto-Next Episode jika video selesai (Hanya untuk native video tag)
                        if (playingIdx < chapters.length - 1) setPlayingIdx(playingIdx + 1);
                      }}
                      className="w-full h-full object-contain absolute inset-0 z-10" 
                    />
                  )}

                  {/* KONTROL NAVIGASI ATAS/BAWAH (LAYAKNYA YOUTUBE SHORTS) */}
                  {chapters.length > 1 && (
                    <div className="absolute right-3 md:right-5 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-40">
                      <button
                        onClick={() => { if (playingIdx > 0) setPlayingIdx(playingIdx - 1); }}
                        className={`w-10 h-10 md:w-12 md:h-12 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center border border-white/20 transition-all ${playingIdx === 0 ? 'opacity-0 pointer-events-none' : 'hover:bg-[#8A2BE2] hover:scale-110 text-white shadow-[0_0_15px_rgba(0,0,0,0.5)]'}`}
                        title="Episode Sebelumnya (Panah Atas)"
                      >
                        <IconArrowUp />
                      </button>
                      <button
                        onClick={() => { if (playingIdx < chapters.length - 1) setPlayingIdx(playingIdx + 1); }}
                        className={`w-10 h-10 md:w-12 md:h-12 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center border border-white/20 transition-all ${playingIdx === chapters.length - 1 ? 'opacity-0 pointer-events-none' : 'hover:bg-[#8A2BE2] hover:scale-110 text-white shadow-[0_0_15px_rgba(0,0,0,0.5)]'}`}
                        title="Episode Selanjutnya (Panah Bawah)"
                      >
                        <IconArrowDown />
                      </button>
                    </div>
                  )}

                  {/* TOMBOL FULLSCREEN KUSTOM (Hanya tampil saat video dimainkan) */}
                  <button
                    onClick={toggleFullscreen}
                    className="absolute top-4 left-4 z-50 p-2.5 rounded-lg bg-black/60 backdrop-blur-md flex items-center justify-center border border-white/20 transition-all hover:bg-[#8A2BE2] hover:scale-110 text-white shadow-[0_0_15px_rgba(0,0,0,0.5)]"
                    title={isFullscreen || cssFullscreen ? "Kecilkan Layar" : "Perbesar Layar (Fullscreen)"}
                  >
                    {isFullscreen || cssFullscreen ? <IconMinimize /> : <IconFullscreen />}
                  </button>
                </>
              ) : (
                <>
                  <img src={getPosterUrl(item.img, item.video_url)} alt={item.title} className="w-full h-full object-cover opacity-70 absolute inset-0" />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#121212] via-black/40 to-transparent"></div>
                  
                  {/* OVERLAY JUDUL (Untuk Series, atau Short di HP/Mobile) */}
                  <div className={`absolute bottom-6 left-6 z-20 right-6 ${isShort ? 'md:hidden' : 'md:left-10'}`}>
                    <span className="inline-block text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded bg-[#8A2BE2] text-white mb-2 shadow-md">
                      {item.category || 'Original'} • {isShort ? 'Short' : 'Series'}
                    </span>
                    <h2 className="text-2xl md:text-4xl font-black text-white drop-shadow-lg mb-4 tracking-tight">
                      {item.title}
                    </h2>
                    <button 
                      onClick={() => setPlayingIdx(0)}
                      className="flex items-center gap-2 bg-[#8A2BE2] hover:bg-violet-600 text-white px-6 py-2.5 rounded-lg font-bold transition-all shadow-lg transform hover:-translate-y-1 text-sm md:text-base w-fit"
                    >
                      <IconPlay /> Putar Tayangan
                    </button>
                  </div>

                  {/* IKON PLAY BESAR TENGAH (Khusus tampilan Short di Desktop sebelum diputar) */}
                  {isShort && (
                    <div className="hidden md:flex absolute inset-0 z-20 items-center justify-center cursor-pointer group" onClick={() => setPlayingIdx(0)}>
                      <div className="w-20 h-20 bg-[#8A2BE2]/80 group-hover:bg-[#8A2BE2] transition-all backdrop-blur-sm rounded-full flex items-center justify-center text-white shadow-[0_0_30px_rgba(138,43,226,0.6)] transform group-hover:scale-110">
                        <IconPlay />
                      </div>
                    </div>
                  )}
                </>
              )}
            </div>

          </div>
        </div>
      );
    };

    // ==========================================
    // 6. MODAL FORM TAMBAH & EDIT VIDEO (ADMIN)
    // ==========================================
    const AdminFormModal = ({ isOpen, onClose, initialData, onSaved, genres, onAddCustomGenre, showToast }) => {
      const [formData, setFormData] = useState({
        type: 'short', category: genres[0] || 'Origin', title: '', description: '', img: '', video_url: '',
        chapters: [{ id: 1, title: 'Episode 1', duration: '02m', drive_url: '' }]
      });
      const [customCategory, setCustomCategory] = useState('');
      const [useCustomCat, setUseCustomCat] = useState(false);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (initialData) {
          setFormData({
            ...initialData,
            chapters: initialData.chapters?.length ? initialData.chapters : [{ id: 1, title: 'Episode 1', duration: '02m', drive_url: '' }]
          });
          setUseCustomCat(false);
        } else {
          setFormData({
            type: 'short', category: genres[0] || 'Origin', title: '', description: '', img: '', video_url: '',
            chapters: [{ id: 1, title: 'Episode 1', duration: '02m', drive_url: '' }]
          });
          setUseCustomCat(false);
        }
      }, [initialData, isOpen, genres]);

      if (!isOpen) return null;

      const handleAddChapter = () => {
        setFormData({
          ...formData,
          chapters: [...formData.chapters, { id: formData.chapters.length + 1, title: `Episode ${formData.chapters.length + 1}`, duration: '05m', drive_url: '' }]
        });
      };

      const handleChapterChange = (index, field, value) => {
        const updated = [...formData.chapters];
        updated[index][field] = value;
        setFormData({ ...formData, chapters: updated });
      };

      const handleRemoveChapter = (index) => {
        setFormData({ ...formData, chapters: formData.chapters.filter((_, i) => i !== index) });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSaving(true);

        const finalCategory = useCustomCat && customCategory.trim() ? customCategory.trim() : formData.category;
        if (useCustomCat && customCategory.trim()) {
          onAddCustomGenre(customCategory.trim());
        }

        const payload = {
          type: formData.type,
          category: finalCategory,
          title: formData.title,
          description: formData.description,
          img: formData.img,
          video_url: formData.video_url,
          chapters: formData.chapters
        };

        let error;
        if (initialData && initialData.id) {
          ({ error } = await supabase.from('lumiz_catalog').update(payload).eq('id', initialData.id));
        } else {
          ({ error } = await supabase.from('lumiz_catalog').insert([payload]));
        }

        setSaving(false);
        if (error) {
          showToast('Gagal menyimpan ke database: ' + error.message, 'error');
        } else {
          showToast(initialData ? 'Video berhasil diubah.' : 'Video berhasil diupload.');
          onSaved();
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#141414] border border-[#8A2BE2]/40 rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto text-white shadow-2xl">
            <div className="flex justify-between items-center mb-6 border-b border-white/10 pb-3">
              <h3 className="text-xl font-bold">
                {initialData ? '✏️ Edit Tayangan Lumiz' : '+ Upload Tayangan Baru'}
              </h3>
              <button onClick={onClose} className="p-1.5 hover:bg-white/10 rounded-full"><IconX /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-sm">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-gray-400 mb-1 font-semibold">Format Tayangan</label>
                  <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white">
                    <option value="short">Shorts (Vertikal)</option>
                    <option value="series">Series (Landscape)</option>
                  </select>
                </div>
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-gray-400 font-semibold">Genre / Kategori</label>
                    <button
                      type="button"
                      onClick={() => setUseCustomCat(!useCustomCat)}
                      className="text-[11px] text-[#8A2BE2] hover:underline font-semibold"
                    >
                      {useCustomCat ? 'Pilih dari Daftar' : '+ Ketik Genre Baru'}
                    </button>
                  </div>
                  {useCustomCat ? (
                    <input
                      required
                      type="text"
                      value={customCategory}
                      onChange={e => setCustomCategory(e.target.value)}
                      placeholder="Ketik nama genre baru..."
                      className="w-full bg-[#0A0A0A] border border-[#8A2BE2] rounded-lg p-2.5 text-white focus:outline-none"
                    />
                  ) : (
                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white">
                      {genres.map(g => (
                        <option key={g} value={g}>{g}</option>
                      ))}
                    </select>
                  )}
                </div>
              </div>

              <div>
                <label className="block text-gray-400 mb-1 font-semibold">Judul Tayangan</label>
                <input required type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} placeholder="Masukkan judul..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white focus:outline-none focus:border-[#8A2BE2]/50" />
              </div>

              <div>
                <label className="block text-gray-400 mb-1 font-semibold">Sinopsis Cerita</label>
                <textarea required rows="2" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} placeholder="Tulis sinopsis cerita di sini..." className="w-full bg-[#0A0A0A] border border-white/15 rounded-lg p-2.5 text-white focus:outline-none focus:border-[#8A2BE2]/50"></textarea>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-[#0A0A0A]/60 p-3.5 rounded-xl border border-white/10">
                <div>
                  <label className="block text-gray-300 mb-1 font-semibold text-xs">🖼️ Link Poster (Drive / Web URL)</label>
                  <input required type="url" value={formData.img} onChange={e => setFormData({...formData, img: e.target.value})} placeholder="https://drive.google.com/..." className="w-full bg-[#141414] border border-white/15 rounded-lg p-2.5 text-xs text-white" />
                  <span className="text-[10px] text-gray-500 mt-1 block">Gambar sampul kartu sebelum di-hover.</span>
                </div>
                <div>
                  <label className="block text-violet-300 mb-1 font-semibold text-xs">▶️ Link YouTube untuk Hover Trailer</label>
                  <input type="url" value={formData.video_url} onChange={e => setFormData({...formData, video_url: e.target.value})} placeholder="https://youtube.com/shorts/... atau watch?v=..." className="w-full bg-[#141414] border border-[#8A2BE2]/50 rounded-lg p-2.5 text-xs text-white" />
                  <span className="text-[10px] text-gray-400 mt-1 block">Otomatis berputar tanpa suara saat kartu di-hover di laptop.</span>
                </div>
              </div>

              <div className="pt-2 border-t border-white/10">
                <div className="flex justify-between items-center mb-2">
                  <div>
                    <label className="font-bold text-gray-200 block">🎬 Isi Video Asli (Link Google Drive / YouTube)</label>
                    <span className="text-[11px] text-gray-400">Video penuh yang diputar saat penonton mengeklik kartu.</span>
                  </div>
                  <button type="button" onClick={handleAddChapter} className="text-xs bg-[#8A2BE2]/20 text-[#8A2BE2] border border-[#8A2BE2]/40 px-3 py-1.5 rounded-md hover:bg-[#8A2BE2] hover:text-white transition font-semibold">
                    + Tambah Chapter
                  </button>
                </div>
                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                  {formData.chapters.map((chap, idx) => (
                    <div key={idx} className="flex gap-2 items-center bg-[#0A0A0A] p-2.5 rounded-lg border border-white/10">
                      <input required type="text" value={chap.title} onChange={e => handleChapterChange(idx, 'title', e.target.value)} placeholder="Judul Chapter" className="w-1/3 bg-transparent border-b border-white/20 p-1 text-xs focus:outline-none text-white" />
                      <input type="text" value={chap.duration} onChange={e => handleChapterChange(idx, 'duration', e.target.value)} placeholder="Durasi (02m)" className="w-16 bg-transparent border-b border-white/20 p-1 text-xs focus:outline-none text-white" />
                      <input required type="url" value={chap.drive_url} onChange={e => handleChapterChange(idx, 'drive_url', e.target.value)} placeholder="Paste Link Google Drive / YouTube Full" className="flex-1 bg-transparent border-b border-white/20 p-1 text-xs focus:outline-none text-white" />
                      {formData.chapters.length > 1 && (
                        <button type="button" onClick={() => handleRemoveChapter(idx)} className="text-red-400 hover:text-red-300 p-1"><IconTrash /></button>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div className="flex justify-end gap-3 pt-4">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20">Batal</button>
                <button type="submit" disabled={saving} className="px-6 py-2 rounded-lg bg-[#8A2BE2] hover:bg-violet-700 font-bold text-white shadow-lg">
                  {saving ? 'Menyimpan...' : 'Simpan ke Lumiz'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // 7. KARTU VIDEO (FIX SHORTS LAPTOP + YOUTUBE HOVER)
    // ==========================================
    const HoverVideoCard = ({ item, isVertical, onClick, isAdmin, onEdit, onDelete }) => {
      const [isHovered, setIsHovered] = useState(false);

      const hoverYtEmbed = getHoverYouTubeEmbedUrl(item.video_url);
      const hasHoverVideo = Boolean(hoverYtEmbed);

      return (
        <div
          style={{ aspectRatio: isVertical ? '9 / 16' : '16 / 9' }}
          className={`relative w-full cursor-pointer overflow-hidden rounded-xl bg-[#141414] group shadow-md hover:shadow-xl border border-white/10 hover:border-[#8A2BE2] transition-all duration-300 transform hover:-translate-y-1 ${
            isVertical ? 'card-vertical' : 'card-horizontal'
          }`}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          onClick={() => onClick(item)}
        >
          {/* POSTER UTAMA */}
          <img
            src={getPosterUrl(item.img, item.video_url)}
            alt={item.title}
            className="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-500 group-hover:scale-105"
          />

          {/* HOVER PREVIEW YOUTUBE */}
          {isHovered && hasHoverVideo && (
            <div className="absolute inset-0 w-full h-full z-10 overflow-hidden bg-black pointer-events-none">
              <iframe
                src={hoverYtEmbed}
                className="w-full h-full border-0 scale-[1.35] pointer-events-none"
                allow="autoplay; encrypted-media"
                title={`Preview ${item.title}`}
              />
            </div>
          )}

          {/* TOMBOL EDIT & HAPUS KHUSUS ADMIN */}
          {isAdmin && (
            <div className="absolute top-2.5 left-2.5 z-40 flex gap-1.5" onClick={e => e.stopPropagation()}>
              <button onClick={() => onEdit(item)} className="p-2 rounded-lg bg-black/80 hover:bg-[#8A2BE2] text-white border border-white/20 shadow-md transition" title="Edit Video">
                <IconEdit />
              </button>
              <button onClick={() => onDelete(item.id)} className="p-2 rounded-lg bg-black/80 hover:bg-red-600 text-white border border-white/20 shadow-md transition" title="Hapus Video">
                <IconTrash />
              </button>
            </div>
          )}

          {/* IKON PLAY TENGAH */}
          <div className={`absolute inset-0 z-20 flex items-center justify-center transition-opacity duration-300 pointer-events-none ${isHovered && hasHoverVideo ? 'opacity-0' : 'opacity-100'}`}>
            <div className="w-11 h-11 md:w-12 md:h-12 bg-black/65 rounded-xl flex items-center justify-center backdrop-blur-sm border border-white/20 shadow-lg text-white group-hover:bg-[#8A2BE2] transition-colors">
              <IconPlay />
            </div>
          </div>

          {/* INFO JUDUL & KATEGORI DI BAWAH KARTU */}
          <div className="absolute inset-x-0 bottom-0 z-30 bg-gradient-to-t from-black/95 via-black/65 to-transparent p-4 flex flex-col justify-end pointer-events-none">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-[10px] font-bold uppercase tracking-wider bg-[#8A2BE2] text-white px-2 py-0.5 rounded shadow">
                {item.category || 'Lumiz'}
              </span>
              {isHovered && hasHoverVideo && (
                <span className="text-[9px] font-semibold bg-black/70 text-violet-300 border border-[#8A2BE2]/50 px-2 py-0.5 rounded">
                  Preview
                </span>
              )}
            </div>
            <h3 className="text-white font-bold text-sm md:text-base drop-shadow-md truncate">{item.title}</h3>
            <p className={`text-gray-300 text-xs line-clamp-2 mt-1 transition-all duration-300 ${isHovered ? 'block' : 'hidden'}`}>
              {item.description}
            </p>
          </div>
        </div>
      );
    };

    // ==========================================
    // 8. STUDIO GALLERY
    // ==========================================
    const StudioGallery = ({ items, loading, viewMode, onItemClick, isAdmin, onAddClick, onEditClick, onDeleteClick, genres, onOpenGenreModal, forceCategory = null }) => {
      const [selectedCat, setSelectedCat] = useState('All');
      const shortsScrollRef = useRef(null);

      // Jika forceCategory diberikan (misal untuk history), gunakan itu
      const currentCategory = forceCategory || selectedCat;
      const allCategories = ['All', ...genres];

      // Filter berdasarkan kategori yang dipilih
      const filteredItems = currentCategory === 'All' 
        ? items 
        : items.filter(i => i.category?.toLowerCase() === currentCategory.toLowerCase());

      const shortsList = filteredItems.filter(i => i.type === 'short');
      const seriesList = filteredItems.filter(i => i.type === 'series');

      const scrollShorts = (dir) => {
        if (shortsScrollRef.current) {
          shortsScrollRef.current.scrollBy({ left: dir * 320, behavior: 'smooth' });
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-6 md:px-12 py-12 space-y-14">
          
          {/* HEADER GALLERY JIKA BUKAN MODE HISTORY */}
          {viewMode !== 'history' && (
            <div className="text-center">
              <p className="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-1">
                OUR OUTPUT — LUMI<span className="text-[#8A2BE2]">Z</span>TUDIO
              </p>
              <h2 className="text-3xl md:text-5xl font-black text-white uppercase tracking-tight">
                {viewMode === 'shorts' ? 'SHORTS GALLERY' : viewMode === 'series' ? 'SERIES GALLERY' : 'STUDIO GALLERY'}
              </h2>

              <div className="flex flex-wrap items-center justify-center gap-2 mt-6">
                {allCategories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCat(cat)}
                    className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${
                      selectedCat === cat 
                        ? 'bg-[#8A2BE2] text-white shadow-lg shadow-[#8A2BE2]/30' 
                        : 'bg-[#141414] text-gray-300 hover:bg-[#8A2BE2]/20 border border-white/10'
                    }`}
                  >
                    {cat}
                  </button>
                ))}

                {isAdmin && (
                  <>
                    <button
                      onClick={onOpenGenreModal}
                      className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#1f1f1f] hover:bg-[#8A2BE2] text-gray-200 hover:text-white border border-white/15 transition"
                    >
                      <IconSettings /> Kelola Genre
                    </button>
                    <button
                      onClick={onAddClick}
                      className="flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition"
                    >
                      <IconPlus /> Upload Video
                    </button>
                  </>
                )}
              </div>
            </div>
          )}

          {loading ? (
            <div className="py-20 text-center text-gray-400 text-sm animate-pulse flex flex-col items-center">
              <div className="w-10 h-10 border-4 border-[#8A2BE2]/30 border-t-[#8A2BE2] rounded-full animate-spin mb-4"></div>
              Memuat data dari Lumiztudio...
            </div>
          ) : items.length === 0 ? (
            <div className="py-20 px-6 text-center bg-[#141414]/60 border border-white/10 rounded-2xl max-w-xl mx-auto">
              <h3 className="text-xl font-bold text-white mb-2">Belum Ada Tayangan</h3>
              <p className="text-xs text-gray-400 mb-6">
                {viewMode === 'history' ? 'Anda belum menonton tayangan apapun.' : 'Katalog tayangan masih kosong di sistem.'}
              </p>
              {isAdmin && viewMode !== 'history' && (
                <button
                  onClick={onAddClick}
                  className="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-[#8A2BE2] hover:bg-violet-700 text-white font-bold text-sm shadow-lg transition"
                >
                  <IconPlus /> Upload Tayangan Sekarang
                </button>
              )}
            </div>
          ) : (
            <>
              {/* SHORTS CONTENT */}
              {(viewMode === 'home' || viewMode === 'shorts' || viewMode === 'history') && (
                <div className="space-y-4 relative">
                  {shortsList.length > 0 && (
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs md:text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
                        <span className="w-1.5 h-4 bg-[#8A2BE2] rounded-full block"></span> VERTICAL SHORTS
                      </h3>
                      <span className="text-xs text-gray-400 font-semibold">{shortsList.length} Tayangan</span>
                    </div>
                  )}

                  {shortsList.length > 0 && (
                    viewMode === 'home' || viewMode === 'history' ? (
                      <div className="relative group">
                        {shortsList.length > 2 && (
                          <button 
                            onClick={() => scrollShorts(-1)}
                            className="hidden md:flex opacity-0 group-hover:opacity-100 absolute -left-5 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white shadow-2xl items-center justify-center hover:bg-[#8A2BE2] transition-all duration-300"
                          >
                            <IconLeft />
                          </button>
                        )}

                        <div ref={shortsScrollRef} className="flex gap-4 md:gap-5 overflow-x-auto scrollbar-hide scroll-smooth py-3">
                          {shortsList.map(item => (
                            <div key={item.id} className="w-[170px] sm:w-[200px] md:w-[240px] shrink-0">

        setLoading(true);
        const { data, error } = await supabase
          .from('lumiz_catalog')
          .select('*')
          .order('created_at', { ascending: false });

        if (!error && data) {
          setCatalog(data);
          const dbCategories = [...new Set(data.map(i => i.category).filter(Boolean))];
          setGenres(prev => {
            const merged = [...prev];
            dbCategories.forEach(c => {
              if (!merged.some(g => g.toLowerCase() === c.toLowerCase())) merged.push(c);
            });
            localStorage.setItem('lumiz_custom_genres', JSON.stringify(merged));
            return merged;
          });
        }
        setLoading(false);

        const historyKey = user ? `lumiz_history_${user.id}` : 'lumiz_history_guest';
        const saved = localStorage.getItem(historyKey);
        if (saved) {
          try { setHistoryIds(JSON.parse(saved)); } 
          catch { setHistoryIds([]); }
        } else {
          setHistoryIds([]);

          localStorage.setItem(historyKey, JSON.stringify(newList));

          <AdminFormModal 
            isOpen={adminModalOpen} 
            onClose={() => setAdminModalOpen(false)} 
            initialData={editingItem}
            onSaved={fetchCatalog}
            genres={genres}
            onAddCustomGenre={handleAddCustomGenre}
            showToast={showToast}
          />

          <GenreManagerModal
            isOpen={genreModalOpen}
            onClose={() => setGenreModalOpen(false)}
            genres={genres}
            setGenres={setGenres}
            onCatalogUpdated={fetchCatalog}
            showToast={showToast}
            requestConfirm={requestConfirm}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
